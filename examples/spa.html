<!doctype html><meta charset="utf-8"><title>Modern App — no form element</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px}
label{display:block;margin:12px 0 4px;font-weight:600}input,select{width:100%;padding:8px;font:inherit}
button{margin-top:16px;padding:10px 18px;font:inherit;background:#36c;color:#fff;border:0;border-radius:6px}
#out{margin-top:16px;padding:10px;background:#eef;border-radius:6px;display:none}</style>
<h1>Modern App</h1>
<p>A React-style page: no &lt;form&gt; element anywhere. Deputy cannot graft a typed tool here.</p>
<div id="app">
  <label for="q">Search query</label><input id="q" placeholder="What are you looking for?">
  <label for="cat">Category</label>
  <select id="cat"><option value="all">All</option><option value="books">Books</option><option value="tools">Tools</option></select>
  <button id="go">Search</button>
</div>
<div id="out"></div>
<script>
 document.getElementById('go').onclick = () => {
   const o = document.getElementById('out');
   o.style.display='block';
   o.textContent = 'SEARCHED: ' + JSON.stringify({q:document.getElementById('q').value, cat:document.getElementById('cat').value});
 };
</script>
