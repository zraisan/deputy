          - region [ref=f1e2694]:
            - heading "References" [level=2] [ref=f1e2696]
            - region [ref=f1e2697]:
              - heading "Notes" [level=3] [ref=f1e2699]
              - list [ref=f1e2702]:
                - listitem [ref=f1e2703]:
                  - link "^" [ref=f1e2705] [cursor=pointer]:
                    - /url: "#cite_ref-6"
                  - generic [ref=f1e2706]:
                    - link "Medieval Greek" [ref=f1e2707] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Medieval_Greek_language
                    - text: ": Ῥωμαῖοι,"
                    - generic [ref=f1e2708]:
                      - link "romanized" [ref=f1e2709] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Romanization_of_Medieval_Greek
                      - text: ":"
                    - generic "Medieval Greek-language romanization" [ref=f1e2710]: Rhōmaîoi
                    - text: . Due to the imperial seat's move to
                    - link "Byzantium" [ref=f1e2711] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Byzantium
                    - text: ", the"
                    - link "adoption of state Christianity" [ref=f1e2712] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Christianity_as_the_Roman_state_religion
                    - text: ", and the predominance of"
                    - link "Greek" [ref=f1e2713] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Medieval_Greek
                    - text: instead of
                    - link "Latin" [ref=f1e2714] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Latin
                    - text: ", most historians make a distinction between the earlier Roman Empire and the later Byzantine Empire."
                    - superscript [ref=f1e2715]:
                      - link "[5]" [ref=f1e2716] [cursor=pointer]:
                        - /url: "#cite_note-FOOTNOTEMillar20062,_15Kaldellis20072–3-5"
                - listitem [ref=f1e2718]:
                  - link "^" [ref=f1e2720] [cursor=pointer]:
                    - /url: "#cite_ref-115"
                  - generic [ref=f1e2721]:
                    - text: Leo VI was officially the son of Basil I, but a persistent rumour alleged that he had been fathered by Michael III, who had previously taken Leo's mother
                    - link "Eudokia Ingerina" [ref=f1e2722] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Eudokia_Ingerina
                    - text: as his mistress. One of Leo's first acts was to rebury Michael III in Basil's mausoleum in the
                    - link "Church of the Holy Apostles" [ref=f1e2723] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Church_of_the_Holy_Apostles
                    - text: complex, which exacerbated the rumours.
                    - superscript [ref=f1e2724]:
                      - link "[113]" [ref=f1e2725] [cursor=pointer]:
                        - /url: "#cite_note-FOOTNOTETougher2009296Kaldellis2023526-114"
                - listitem [ref=f1e2727]:
                  - link "^" [ref=f1e2729] [cursor=pointer]:
                    - /url: "#cite_ref-202"
                  - generic [ref=f1e2730]:
                    - link "Arianism" [ref=f1e2731] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Arianism
                    - text: ", one of the first major controversies, shook the empire until it was addressed by the"
                    - link "Nicene Creed" [ref=f1e2732] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Nicene_Creed
                    - text: .
                    - superscript [ref=f1e2733]:
                      - link "[198]" [ref=f1e2734] [cursor=pointer]:
                        - /url: "#cite_note-FOOTNOTEBerndtSteinacher20141–2,_8–19Löhr200714-200"
                    - text: Other controversies persisted, leading to schisms, such as debates on the fundamental definitions of Christ's nature at the
                    - link "Council of Chalcedon" [ref=f1e2736] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Council_of_Chalcedon
                    - text: in 451.
                    - superscript [ref=f1e2737]:
                      - link "[199]" [ref=f1e2738] [cursor=pointer]:
                        - /url: "#cite_note-FOOTNOTESabo2018vi,_9Löhr200714–23-201"
