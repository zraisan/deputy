                  - link "aulos" [ref=f1e2373] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Aulos
                  - text: ", and"
                  - link "lyre" [ref=f1e2374] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Lyre
                  - text: from a Byzantine villa in
                  - link "Maryamin" [ref=f1e2375] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Maryamin,_Hama
                  - text: ", Syria"
                  - superscript [ref=f1e2376]:
                    - link "[313]" [ref=f1e2377] [cursor=pointer]:
                      - /url: "#cite_note-FOOTNOTERing1994318-316"
              - paragraph [ref=f1e2379]:
                - link "Byzantine music" [ref=f1e2380] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_music
                - text: is eclectically descended from early
                - link "Christian plainsong" [ref=f1e2381] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Plainsong
                - text: ","
                - link "Jewish music" [ref=f1e2382] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jewish_music
                - text: ", and a variety of"
                - link "ancient music" [ref=f1e2383] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ancient_music
                - text: ; its exact connections to
                - link "ancient Greek music" [ref=f1e2384] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Musical_system_of_ancient_Greece
                - text: remain uncertain.
                - superscript [ref=f1e2385]:
                  - link "[314]" [ref=f1e2386] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEVelimirović199028–29Conomos19911426-317"
                - text: It included both
                - link "sacred" [ref=f1e2388] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sacred_music
                - text: and
                - link "secular" [ref=f1e2389] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Secular_music
                - text: traditions, but the latter is little known, whereas the former remains the central music of
                - link "Eastern Orthodox" [ref=f1e2390] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eastern_Orthodox
                - text: liturgy into the 21st century.
                - superscript [ref=f1e2391]:
                  - link "[315]" [ref=f1e2392] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEConomos19911424–1426LevyTroelsgård2016§_Introduction-318"
                - text: The empire's church music, known as Byzantine
                - link "chant" [ref=f1e2394] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chant
                - text: ", was exclusively unaccompanied"
                - link "monodic" [ref=f1e2395] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Monody
                - text: vocal music, sung in Greek.
                - superscript [ref=f1e2396]:
                  - link "[316]" [ref=f1e2397] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEVelimirović199026–27,_29-319"
                - text: From the 8th century, chant melodies were governed by the
                - link "Oktōēchos" [ref=f1e2400] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Oktōēchos
                - text: framework, a set of eight
                - link "modes" [ref=f1e2401] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mode_(music)
                - text: —
                - link "echos" [ref=f1e2402] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Echos
                - text: (
                - generic "Ancient Greek (to 1453)-language text" [ref=f1e2403]: ἦχος
                - text: ; lit.'sound')—which each provide predetermined
                - link "motivic" [ref=f1e2405] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Motif_(music)
                - text: formulae for composition.
                - superscript [ref=f1e2406]:
                  - link "[317]" [ref=f1e2407] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEVelimirović199045–46Conomos19911425LevyTroelsgård2016§5_\"System_of_eight_modes_('oktōēchos')\",_§7_\"Formulaic_chants\"-320"
                - text: These formulae were chosen for proper
                - link "text stress" [ref=f1e2409] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Text_stress
                - text: and occasionally for
                - link "text painting" [ref=f1e2410] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Text_painting
                - text: ", then collated through"
                - link "centonisation" [ref=f1e2411] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Centonisation
                - text: into
                - link "hymns" [ref=f1e2412] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hymn
                - text: or
                - link "psalms" [ref=f1e2413] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Psalm
                - text: .
                - superscript [ref=f1e2414]:
                  - link "[318]" [ref=f1e2415] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEVelimirović199029LevyTroelsgård2016§7_\"Formulaic_chants\"-321"
              - paragraph [ref=f1e2417]:
                - text: Byzantine chant was central to the
                - link "Byzantine Rite" [ref=f1e2418] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Rite
                - text: ; the earliest music was not
                - link "notated" [ref=f1e2419] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Musical_notation
                - text: ","
                - superscript [ref=f1e2420]:
                  - link "[319]" [ref=f1e2421] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEVelimirović199026–27-322"
                - text: including early mono
                - link "strophic" [ref=f1e2423] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Strophic
                - text: short hymns like the
                - link "troparion" [ref=f1e2424] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Troparion
                - text: .
                - superscript [ref=f1e2425]:
                  - link "[320]" [ref=f1e2426] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELevyTroelsgård2016§10_\"Syllabic_hymn_settings\"-323"
                - text: Proto-
                - link "Ekphonetic notation" [ref=f1e2428] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ekphonetic_notation
                - text: (9th century onwards) marked simple
                - link "recitation" [ref=f1e2429] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Recitation
                - text: patterns. The
                - link "neumatic" [ref=f1e2430] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neumatic
                - text: Palaeo-Byzantine notation system emerged in the 10th century, and the Middle Byzantine "Round Notation" from the mid-12th century onwards is the first fully
                - link "diastematic" [ref=f1e2431] [cursor=pointer]:
                  - /url: https://en.wiktionary.org/wiki/diastematic
                - text: scheme.
                - superscript [ref=f1e2432]:
                  - link "[321]" [ref=f1e2433] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEVelimirović199048–51LevyTroelsgård2016§3_\"Melodic_notation\"-324"
                - text: Several major forms developed alongside
                - link "well-known composers" [ref=f1e2435] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_Byzantine_composers
                - text: ": the long"
                - link "kontakion" [ref=f1e2436] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kontakion
                - text: (5th century onwards), popularised by
                - link "Romanos the Melodist" [ref=f1e2437] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romanos_the_Melodist
                - text: ; the also-extensive
                - link "kanōn" [ref=f1e2438] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Canon_(hymnography)
                - text: (late 7th century onwards), developed by
                - link "Andrew of Crete" [ref=f1e2439] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andrew_of_Crete
                - text: ; and the shorter
                - link "sticheron" [ref=f1e2440] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sticheron
                - text: (at least 8th century onwards), championed by
                - link "Kassia" [ref=f1e2441] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kassia
                - text: .
                - superscript [ref=f1e2442]:
                  - link "[322]" [ref=f1e2443] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEConomos19911425LevyTroelsgård2016§3_\"Melodic_notation\"Mellas20202-325"
                - text: By the Palaiologan period, the dominance of strict compositional rules lessened and
                - link "John Koukouzeles" [ref=f1e2445] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_Koukouzeles
                - text: led a new school favouring a more
                - link "ornamental" [ref=f1e2446] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ornament_(music)
                - text: "\"kalophonic\" style which deeply informed post-empire Neo-Byzantine music."
                - superscript [ref=f1e2447]:
                  - link "[323]" [ref=f1e2448] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEConomos19911425–1426-326"
              - paragraph [ref=f1e2450]:
                - text: Secular music, often state-sponsored, was ubiquitous in daily life and featured in a variety of ceremonies, festivals, and theatre.
                - superscript [ref=f1e2451]:
                  - link "[324]" [ref=f1e2452] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETouliatos2001§_Introduction-327"
                - text: Secular vocal music was rarely notated, and extant manuscripts date much later, suggesting the tradition was passed through
                - link "oral tradition" [ref=f1e2454] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Oral_tradition
                - text: and likely
                - link "improvised" [ref=f1e2455] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Improvised
                - text: .
                - superscript [ref=f1e2456]:
                  - link "[325]" [ref=f1e2457] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETouliatos2001§_\"Sources\"-328"
                - text: Prohibited for liturgical use, a wide variety of Byzantine
                - link "instruments" [ref=f1e2459] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Musical_instrument
                - text: flourished in secular contexts, although no notated instrumental music survives.
                - superscript [ref=f1e2460]:
                  - link "[326]" [ref=f1e2461] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEConomosKazhdan19911426-329"
                - text: It is uncertain to what extent instrumentalists improvised or if they doubled vocalists monophonically or
                - link "heterophonically" [ref=f1e2463] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Heterophony
                - text: .
                - superscript [ref=f1e2464]:
                  - link "[327]" [ref=f1e2465] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEConomosKazhdan19911426Touliatos2001§2_\"Instruments_and_performing_practice\"-330"
                - text: Among the best known instruments are the
                - link "hydraulic organ" [ref=f1e2467] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hydraulic_organ
                - text: ", used for circus and imperial court events; the"
                - link "ancient Greek" [ref=f1e2468] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Music_of_ancient_Greece
                - text: "-descended"
                - link "aulos" [ref=f1e2469] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aulos
                - text: ", a"
                - link "wind instrument" [ref=f1e2470] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wind_instrument
                - text: ; the
                - link "tambouras" [ref=f1e2471] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tambouras
                - text: ", a plucked"
                - link "string instrument" [ref=f1e2472] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/String_instrument
                - text: ; and mostly popularly, the
                - link "Byzantine lyra" [ref=f1e2473] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_lyra
                - text: .
                - superscript [ref=f1e2474]:
                  - link "[327]" [ref=f1e2475] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEConomosKazhdan19911426Touliatos2001§2_\"Instruments_and_performing_practice\"-330"
                - text: Prominent genres included
                - link "acclamation" [ref=f1e2477] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Acclamatio
                - text: chants of laudation or salutation; the celebratory
                - link "Acritic songs" [ref=f1e2478] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Acritic_songs
                - text: ; symposia instrumental
                - link "banquets" [ref=f1e2479] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Banquet
                - text: ", based on ancient"
                - link "symposiums" [ref=f1e2480] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Symposium_(ancient_Greece)
                - text: ; and
                - link "dance music" [ref=f1e2481] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dance_music
                - text: .
                - superscript [ref=f1e2482]:
                  - link "[328]" [ref=f1e2483] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETouliatos2001§3_\"Genres_and_composers\"-331"
            - region [ref=f1e2485]:
              - heading "Science and technology" [level=3] [ref=f1e2487]
              - note [ref=f1e2488]:
                - text: "Main article:"
                - link "Byzantine science" [ref=f1e2489] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_science
              - note [ref=f1e2490]:
                - text: "See also:"
                - link "List of Byzantine inventions" [ref=f1e2491] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_Byzantine_inventions
                - text: ","
                - link "Byzantine philosophy" [ref=f1e2492] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_philosophy
                - text: ", and"
                - link "List of Byzantine scholars" [ref=f1e2493] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_Byzantine_scholars
              - figure [ref=f1e2494]:
                - link [ref=f1e2495] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:20131203_Istanbul_048.jpg
                  - img "A photograph of the interior of a building built with blue arches and pillars and ornate yellow walls" [ref=f1e2496]
                - generic [ref=f1e2497]:
                  - text: Interior of the
                  - link "Hagia Sophia" [ref=f1e2498] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Hagia_Sophia
                  - text: ; the influence of
                  - link "Archimedes" [ref=f1e2499] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Archimedes
                  - text: "' principles of solid geometry is evident."
              - paragraph [ref=f1e2500]:
                - text: The scholars of the empire played a principal role in transmitting classical knowledge to the
                - link "Islamic world" [ref=f1e2501] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_contributions_to_the_Islamic_world
                - text: and
                - link "Renaissance Italy" [ref=f1e2502] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Italian_Renaissance
                - text: ", as well as producing commentaries that helped expand scientific knowledge."
                - superscript [ref=f1e2503]:
                  - link "[329]" [ref=f1e2504] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERobins19938–9Lazaris2020a17Telelis2020186-332"
                - text: This medieval Greek scholarship was not only based on scientific treatises from antiquity but also drew from Islamic, Latin, and Hebrew works, which helped spearhead new developments as late as the 11th and 12th centuries.
                - superscript [ref=f1e2506]:
                  - link "[330]" [ref=f1e2507] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELazaris2020a3,_11Inglebert202027TatakesMoutafakis2003180-333"
                - text: Although the Empire is sometimes not associated with scientific innovation or major discoveries,
                - superscript [ref=f1e2509]:
                  - link "[331]" [ref=f1e2510] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMango2008958Nicolaidis_et_al.2016544–545-334"
                - text: its scientific contributions have also been described as underestimated.
                - superscript [ref=f1e2512]:
                  - link "[332]" [ref=f1e2513] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETihon2013206-335"
                - text: Incomplete assessments of Byzantine texts
                - superscript [ref=f1e2515]:
                  - link "[332]" [ref=f1e2516] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETihon2013206-335"
                - text: and the challenges of applying modern definitions of science to pre-modern contexts are factors in these ongoing debates.
                - superscript [ref=f1e2518]:
                  - link "[333]" [ref=f1e2519] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELazaris2020a1–5-336"
              - figure [ref=f1e2521]:
                - link [ref=f1e2522] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Liquid_fire_granades_Chania.jpg
                  - img "Two pots surrounded by caltrops" [ref=f1e2523]
                - generic [ref=f1e2524]:
                  - text: Ceramic grenades which were filled with
                  - link "Greek fire" [ref=f1e2525] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Greek_fire
                  - text: ", surrounded by"
                  - link "caltrops" [ref=f1e2526] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Caltrop
                  - text: ", 10th–12th century,"
                  - link "National Historical Museum" [ref=f1e2527] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/National_Historical_Museum_(Greece)
                  - text: ", Athens"
              - paragraph [ref=f1e2528]:
                - text: Key people passed on important traditions that underpinned this scholarship, especially in the realms of philosophy, geometry, astronomy, and grammar.
                - superscript [ref=f1e2529]:
                  - link "[334]" [ref=f1e2530] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEManolova202066-337"
                - text: For example, the Hagia Sophia architect
                - link "Isidore of Miletus" [ref=f1e2532] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Isidore_of_Miletus
                - text: (c.
                - generic [ref=f1e2533]: "530"
                - text: ), compiled
                - link "Archimedes" [ref=f1e2534] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Archimedes
                - text: "' works which"
                - link "Leo the Mathematician" [ref=f1e2535] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leo_the_Mathematician
                - text: (c.
                - generic [ref=f1e2536]: "850"
                - text: ) incorporated into formal courses, and is why the
                - link "Archimedes Palimpsest" [ref=f1e2537] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Archimedes_Palimpsest
                - text: is known today.
                - superscript [ref=f1e2538]:
                  - link "[335]" [ref=f1e2539] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEManolova202066Jones2005520-521-338"
                - link "John Philoponus" [ref=f1e2541] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_Philoponus
                - text: and his critiques of
                - link "Aristotelian physics" [ref=f1e2542] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aristotelian_physics
                - text: ", the pharmacologist"
                - link "Pedanius Dioscorides" [ref=f1e2543] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pedanius_Dioscorides
                - text: ", and Ptolematic geography and astronomy had an important influence on western science, as seen with"
                - link "Ptolemy" [ref=f1e2544] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ptolemy
                - text: "'s influence on"
                - link "Copernicus" [ref=f1e2545] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nicolaus_Copernicus
                - text: and Philoponus on
                - link "Bonaventure" [ref=f1e2546] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bonaventure
                - text: ","
                - link "Gersonides" [ref=f1e2547] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gersonides
                - text: ","
                - link "Buridan" [ref=f1e2548] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jean_Buridan
                - text: ","
                - link "Oresme" [ref=f1e2549] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nicole_Oresme
                - text: and
                - link "Galileo" [ref=f1e2550] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Galileo_Galilei
                - text: .
                - superscript [ref=f1e2551]:
                  - link "[336]" [ref=f1e2552] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEWildberg2018Lindberg1992162-339"
              - paragraph [ref=f1e2554]:
                - text: Military innovations included the
                - link "riding stirrup" [ref=f1e2555] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stirrup
                - text: which provided stability for mounted archers and dramatically transformed the army; a specialised type of
                - link "horseshoe" [ref=f1e2556] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Horseshoe
                - text: ; the
                - link "lateen sail" [ref=f1e2557] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lateen
                - text: ", which improved a ship's responsiveness to wind; and"
                - link "Greek fire" [ref=f1e2558] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_fire
                - text: —an incendiary weapon capable of burning even when doused with water, first appearing around the time of the
                - link "Siege of Constantinople (674–678)" [ref=f1e2559] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(674–678)
                - text: .
                - superscript [ref=f1e2560]:
                  - link "[337]" [ref=f1e2561] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELazaris2020a16Salmon2020445–446Partington199913-340"
                - text: In
                - link "healthcare" [ref=f1e2563] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_medicine
                - text: ", the empire pioneered the concept of the hospital as an institution offering medical care and the possibility of a cure for the patients, rather than merely being a place to die."
                - superscript [ref=f1e2564]:
                  - link "[338]" [ref=f1e2565] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELindberg1992349Nutton19849Miller1997ix,_3–4Bennett20167–14-341"
          - region [ref=f1e2567]:
            - heading "Legacy" [level=2] [ref=f1e2569]
            - note [ref=f1e2570]:
              - text: "Main article:"
              - link "Legacy of the Roman Empire" [ref=f1e2571] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Legacy_of_the_Roman_Empire
            - region [ref=f1e2572]:
              - heading "Political aftermath" [level=3] [ref=f1e2574]
              - note [ref=f1e2575]:
                - text: "See also:"
                - link "Succession to the Byzantine Empire" [ref=f1e2576] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Succession_to_the_Byzantine_Empire
              - figure [ref=f1e2577]:
                - link [ref=f1e2578] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Eastern_Mediterranean_1450.svg
                  - img "A map centred on Greece and Turkey in 1450 AD. The Byzantine Empire holds only Southern Greece and northwestern Turkey" [ref=f1e2579]
                - generic [ref=f1e2580]:
                  - text: The Eastern Mediterranean just before the
                  - link "Fall of Constantinople" [ref=f1e2581] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Fall_of_Constantinople
              - paragraph [ref=f1e2582]:
                - text: After Constantinople fell, the Ottomans quickly absorbed the remaining independent territories, including
                - link "Acciaiuoli" [ref=f1e2583] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Acciaioli_family
                - text: Athens in 1458, Morea in 1460, Trebizond in 1461, and
                - link "Gattilusi" [ref=f1e2584] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gattilusio
                - link "Lesbos" [ref=f1e2585] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lesbos
                - text: in 1462.
                - superscript [ref=f1e2586]:
                  - link "[339]" [ref=f1e2587] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023914Nicol1993407–408Bryer2009856-342"
                - text: They dismantled the Empire's political and secular institutions, leaving the impoverished Church to manage what would be later called the
                - link "Rum Millet" [ref=f1e2590] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rum_Millet
                - text: ", primarily as a tool for taxing its followers."
                - superscript [ref=f1e2591]:
                  - link "[340]" [ref=f1e2592] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023914–915Bryer2009869Papademetriou201552-343"
                - text: As the sole sovereign Orthodox state, Russia developed the
                - link "Third Rome doctrine" [ref=f1e2594] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Moscow,_third_Rome
                - text: ", emphasising its cultural heritage as distinct from Western Europe, because the latter had inherited much of the empire's secular learning."
                - superscript [ref=f1e2595]:
                  - link "[341]" [ref=f1e2596] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTESeton-Watson196731Kaldellis2023901Mango2008960–961-344"
                - text: The
                - link "Danubian Principalities" [ref=f1e2598] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Danubian_Principalities
                - text: became a haven for Orthodox Christians and
                - link "Phanariot" [ref=f1e2599] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Phanariots
                - text: Greeks who sought to recreate a Byzantine Greek Empire.
                - superscript [ref=f1e2600]:
                  - link "[342]" [ref=f1e2601] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEClark2000215-345"
                - text: In modern Greece, members of the Rum Millet
                - link "increasingly identified as Greeks" [ref=f1e2603] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Names_of_the_Greeks#Romans_(Ῥωμαῖοι)
                - text: ", eventually leading to a"
                - link "successful war of independence" [ref=f1e2604] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_War_of_Independence
                - text: in the 19th century.
                - superscript [ref=f1e2605]:
                  - link "[343]" [ref=f1e2606] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023915Treadgold1997b1125-346"
                - text: The modern Greek state nearly doubled its territory through the pursuit of the
                - link "Megali Idea" [ref=f1e2608] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Megali_Idea
                - text: —a vision of reclaiming the former lands of the eastern empire—achieving limited success during the
                - link "Crimean War" [ref=f1e2609] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crimean_War
                - text: but making significant gains during the
                - link "Balkan Wars" [ref=f1e2610] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Balkan_Wars
                - text: .
                - superscript [ref=f1e2611]:
                  - link "[344]" [ref=f1e2612] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEIvanovaAnderson20241240Kaldellis2022b360-347"
              - paragraph [ref=f1e2614]:
                - text: Since the 15th century, Byzantine history has been deeply politicised, woven into nationalist, colonialist, and imperialist narratives.
                - superscript [ref=f1e2615]:
                  - link "[345]" [ref=f1e2616] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEIvanovaAnderson20241233,_1235,_1248AschenbrennerRansohoff2022b372Kaldellis2022b352-348"
                - text: This politicisation appears not only in Greece but also in Bulgarian, Romanian, Serbian, Hungarian, and Turkish nationalism, as well as in former French and Russian imperialist agendas.
                - superscript [ref=f1e2618]:
                  - link "[346]" [ref=f1e2619] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEIvanovaAnderson20241229–41,_1234,_1238Haarer201018–19-349"
                - text: In the English-speaking world, interpretations of Byzantine history frequently surface in political debates, alongside the growing appreciation for its legacy.
                - superscript [ref=f1e2621]:
                  - link "[347]" [ref=f1e2622] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEIvanovaAnderson20241248Haarer201010–12Goldwyn2022325-350"
                - text: The complexity of this history makes it a sensitive topic, especially regarding Greece's role in Europe's evolving sense of identity and the origin stories of many European nations.
                - superscript [ref=f1e2624]:
                  - link "[348]" [ref=f1e2625] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEIvanovaAnderson20241248Haarer201018-19Stewart20223Kaldellis20232–3Cameron2010177–178-351"
            - region [ref=f1e2627]:
              - heading "Cultural aftermath" [level=3] [ref=f1e2629]
              - note [ref=f1e2630]:
                - text: "See also:"
                - link "Greek scholars in the Renaissance" [ref=f1e2631] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_scholars_in_the_Renaissance
                - text: ","
                - link "Rum millet" [ref=f1e2632] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rum_millet
                - text: ","
                - link "Romioi" [ref=f1e2633] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romioi
                - text: ", and"
                - link "Byzantine commonwealth" [ref=f1e2634] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_commonwealth
              - figure [ref=f1e2635]:
                - link [ref=f1e2636] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Sousoší_Cyrila_a_Metoděje_09.jpg
                  - img "A photograph of statue, which depicts two bearded and hooded men; the one on the left is holding up a cross and the one on the right is holding up a book" [ref=f1e2637]
                - generic [ref=f1e2638]:
                  - text: Monument to
                  - link "St. Cyril and St. Methodius" [ref=f1e2639] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Saints_Cyril_and_Methodius
                  - text: ", Byzantine missionaries to the Slavs, on"
                  - link "Mt. Radhošť" [ref=f1e2640] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Radhošť
                  - text: in Czechia
              - paragraph [ref=f1e2641]:
                - text: The Byzantine Empire distinctively blended Roman political traditions, Greek literary heritage, and Christianity, creating the civilisational framework that laid the foundation for medieval Europe.
                - superscript [ref=f1e2642]:
                  - link "[349]" [ref=f1e2643] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis20233–4Cameron2010175-352"
                - text: The Empire preserved European civilisation by acting as a shield against forces from Eurasian Steppe people such as the Avars, Bulgars, Cumans, Huns, Pechenegs, and Turks.
                - superscript [ref=f1e2645]:
                  - link "[350]" [ref=f1e2646] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMango2008958–959Obolensky19943-353"
              - paragraph [ref=f1e2648]:
                - text: The empire's legal codes significantly influenced the civil law traditions of continental Europe, Russia, Latin America, Ethiopia, and even the English-speaking common law countries; and possibly influenced Islamic legal traditions as well.
                - superscript [ref=f1e2649]:
                  - link "[351]" [ref=f1e2650] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStolte201510–11MerrymanPérez-Perdomo2007367–368Stein199936-354"
                - superscript [ref=f1e2652]:
                  - link "[352]" [ref=f1e2653] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTESalogubovaZenkov2018-355"
                - text: It also preserved and transmitted classical learning and manuscripts, making important contributions to the intellectual revival which fuelled
                - link "Italian humanism" [ref=f1e2655] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Renaissance_humanism
                - text: .
                - superscript [ref=f1e2656]:
                  - link "[353]" [ref=f1e2657] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTECameron2010165Mango2008960-356"
              - paragraph [ref=f1e2659]:
                - text: The Byzantine Empire played a pivotal role in shaping Christianity by supporting early Church fathers and the decisions of Church councils; developing the institution of
                - link "monasticism" [ref=f1e2660] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christian_monasticism
                - text: ; and fostering the
                - link "Orthodox tradition" [ref=f1e2661] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eastern_Orthodoxy
                - text: which continues to define much of Eastern European identity.
                - superscript [ref=f1e2662]:
                  - link "[354]" [ref=f1e2663] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPoppe199125Cameron2010261Mango2008358-357"
                - text: It was also instrumental in preserving the Greek language and is credited with developing the
                - link "Glagolitic alphabet" [ref=f1e2665] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Glagolitic_script
                - text: ", which later evolved into the"
                - link "Cyrillic script" [ref=f1e2666] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cyrillic_script
                - text: and
                - link "Old Church Slavonic" [ref=f1e2667] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Old_Church_Slavonic
                - text: .
                - superscript [ref=f1e2668]:
                  - link "[355]" [ref=f1e2669] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPoppe199125Ivanič2016127Mango2008959,_961-358"
                - text: These innovations provided the first literary language for the Slavs and formed the educational foundation for all Slavic nations.
                - superscript [ref=f1e2671]:
                  - link "[356]" [ref=f1e2672] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPoppe199125Ivanič2016127Cameron2010165Shepard20067–8-359"
