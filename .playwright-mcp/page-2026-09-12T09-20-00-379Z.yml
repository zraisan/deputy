                    - link "hyperpyron" [ref=f1e353] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Hyperpyron
            - paragraph [ref=f1e354]:
              - text: The Byzantine Empire, also known as the Eastern Roman Empire, was the continuation of the
              - link "Roman Empire" [ref=f1e355] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Roman_Empire
              - text: centred on
              - link "Constantinople" [ref=f1e356] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Constantinople
              - text: during
              - link "late antiquity" [ref=f1e357] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Late_antiquity
              - text: and the
              - link "Middle Ages" [ref=f1e358] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Middle_Ages
              - text: . Having survived the
              - link "fall of the Western Roman Empire" [ref=f1e359] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fall_of_the_Western_Roman_Empire
              - text: in the 5th centuryAD, it endured until the
              - link "fall of Constantinople" [ref=f1e361] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fall_of_Constantinople
              - text: to the
              - link "Ottoman Empire" [ref=f1e362] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ottoman_Empire
              - text: in 1453. The term 'Byzantine Empire' was coined only after its demise;
              - link "its citizens" [ref=f1e363] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantines
              - text: used the term 'Roman Empire' and called themselves 'Romans'.
              - superscript [ref=f1e364]:
                - link "[a]" [ref=f1e365] [cursor=pointer]:
                  - /url: "#cite_note-6"
            - paragraph [ref=f1e367]:
              - text: During the early centuries of the Roman Empire, the western provinces were
              - link "Latinised" [ref=f1e368] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Romanization_(cultural)
              - text: ", but the eastern parts kept their"
              - link "Hellenistic culture" [ref=f1e369] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hellenistic_culture
              - text: .
              - link "Constantine I" [ref=f1e370] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Constantine_the_Great
              - text: (
              - generic [ref=f1e371]: r. 324–337
              - text: ) legalised
              - link "Christianity" [ref=f1e372] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Christianity
              - text: and moved the capital to Constantinople.
              - link "Theodosius I" [ref=f1e373] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Theodosius_I
              - text: (
              - generic [ref=f1e374]: r. 379–395
              - text: ) made Christianity the
              - link "state religion" [ref=f1e375] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/State_religion
              - text: and Greek gradually replaced Latin for official use. The empire adopted a defensive strategy and, throughout its remaining history, experienced recurring cycles of decline and recovery.
            - paragraph [ref=f1e376]:
              - text: The Byzantine Empire reached its greatest extent under the reign of
              - link "Justinian I" [ref=f1e377] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Justinian_I
              - text: (
              - generic [ref=f1e378]: r. 527–565
              - text: ), who briefly reconquered much of Italy and the western
              - link "Mediterranean coast" [ref=f1e379] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mediterranean_Sea
              - text: . A
              - link "plague began" [ref=f1e380] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Plague_of_Justinian
              - text: around 541, and a
              - link "prolonged warfare with Persia" [ref=f1e381] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantine–Sasanian_War_of_602–628
              - text: placed fiscal and military strain on the empire, contributing to political and strategic challenges in the decades that followed. In the 630s and 640s the
              - link "Arab conquests" [ref=f1e382] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Early_Muslim_conquests
              - text: defeated Byzantine field armies in
              - link "Syria" [ref=f1e383] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Roman_Syria
              - text: and
              - link "Egypt" [ref=f1e384] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Roman_Egypt
              - text: ", resulting in the permanent loss of those provinces to the"
              - link "Rashidun Caliphate" [ref=f1e385] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rashidun_Caliphate
              - text: . In 698, Africa
              - link "was lost" [ref=f1e386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_of_Carthage_(698)
              - text: to the
              - link "Umayyad Caliphate" [ref=f1e387] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Umayyad_Caliphate
              - text: ", but the empire stabilised under the"
              - link "Isaurian dynasty" [ref=f1e388] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Isaurian_dynasty
              - text: . It expanded once more under the
              - link "Macedonian dynasty" [ref=f1e389] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Macedonian_dynasty
              - text: ", experiencing"
              - link "a two-century-long renaissance" [ref=f1e390] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Macedonian_Renaissance
              - text: . Thereafter, periods of civil war and
              - link "Seljuk" [ref=f1e391] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Seljuk_dynasty
              - text: incursion resulted in the loss of most of
              - link "Asia Minor" [ref=f1e392] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Anatolia
              - text: . The empire recovered during the
              - link "Komnenian restoration" [ref=f1e393] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Komnenian_restoration
              - text: ", and Constantinople remained the largest and wealthiest city in Europe until the 13th century, when it was overtaken by Paris."
            - paragraph [ref=f1e394]:
              - text: The empire was severely fragmented in 1204, following the
              - link "sack of Constantinople" [ref=f1e395] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sack_of_Constantinople
              - text: during the
              - link "Fourth Crusade" [ref=f1e396] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fourth_Crusade
              - text: ; its former territories
              - link "were then divided" [ref=f1e397] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Partitio_terrarum_imperii_Romaniae
              - text: into competing Greek
              - link "rump states" [ref=f1e398] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rump_state
              - text: and
              - link "Latin realms" [ref=f1e399] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Frankokratia
              - text: . Despite the eventual
              - link "recovery of Constantinople" [ref=f1e400] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Palaiologos_dynasty
              - text: in 1261, the reconstituted empire wielded only regional power during its final two centuries. Its remaining territories were progressively annexed by the Ottomans in
              - link "a series of wars" [ref=f1e401] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantine–Ottoman_wars
              - text: fought in the 14th and 15th centuries. The fall of Constantinople to the Ottomans in 1453 brought the empire to an end.
          - region [ref=f1e402]:
            - heading "Nomenclature" [level=2] [ref=f1e404]
            - note [ref=f1e405]:
              - text: "See also:"
              - link "Names of the Greeks" [ref=f1e406] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Names_of_the_Greeks
            - paragraph [ref=f1e407]:
              - text: The empire's inhabitants, today generally known as
              - link "Byzantines" [ref=f1e408] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantines
              - text: ", regarded themselves as"
              - link "Romans" [ref=f1e409] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Roman_people#Survival_of_the_Roman_Empire_in_the_east
              - text: (in Greek,
              - generic "Ancient Greek (to 1453)-language text" [ref=f1e410]: Ῥωμαῖοι
              - text: or
              - generic "Ancient Greek (to 1453)-language romanization" [ref=f1e411]: Romaioi
              - text: ).
              - superscript [ref=f1e412]:
                - link "[6]" [ref=f1e413] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEKaldellis2022a351AschenbrennerRansohoff2022a1-7"
              - text: Similarly, their Islamic contemporaries called their empire the "land of the Romans" (
              - generic "Arabic-language romanization" [ref=f1e415]: Bilād al-Rūm
              - text: ).
              - superscript [ref=f1e416]:
                - link "[7]" [ref=f1e417] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEAschenbrennerRansohoff2022a1-8"
              - text: After 800 AD, Western Europe called them "Greeks" (
              - generic "Latin-language text" [ref=f1e419]: Graeci
              - text: ), as the Papacy and medieval German emperors regarded themselves as the true inheritors of Roman identity.
              - superscript [ref=f1e420]:
                - link "[8]" [ref=f1e421] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEKaldellis20232AschenbrennerRansohoff2022a2-9"
              - text: The adjective "Byzantine", derived from
              - link "Byzantion" [ref=f1e423] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantium
                - generic "Ancient Greek (to 1453)-language romanization" [ref=f1e424]: Byzantion
              - text: (
              - generic "Latin-language text" [ref=f1e425]: Byzantium
              - text: in Latin), the name of the Greek settlement
              - link "Constantinople" [ref=f1e426] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Constantinople
              - text: was established on, was only used to describe the inhabitants of the city; it did not refer to the empire, called
              - generic "Ancient Greek (to 1453)-language romanization" [ref=f1e427]: Rhomanía
              - text: (
              - generic "Ancient Greek (to 1453)-language text" [ref=f1e428]: Ῥωμανία
              - text: or "Romanland") by its citizens.
              - superscript [ref=f1e429]:
                - link "[9]" [ref=f1e430] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEKaldellis2022a349,_351CormackHaldonJeffreys20084-10"
            - paragraph [ref=f1e432]:
              - text: Following the empire's fall,
              - link "early modern" [ref=f1e433] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Early_modern
              - text: scholars referred to it by many names, including the "Eastern Empire", the "Low Empire", the "Late Empire", the "Empire of the Greeks", "Empire of Constantinople", and "Roman Empire".
              - superscript [ref=f1e434]:
                - link "[10]" [ref=f1e435] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEAschenbrennerRansohoff2022a2-11"
              - text: The increasing use of "Byzantine" and "Byzantine Empire" may have started with
              - link "Theodore Metochites" [ref=f1e437] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Theodore_Metochites
              - superscript [ref=f1e438]:
                - link "[11]" [ref=f1e439] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEMagdalino202541–43-12"
              - text: or
              - link "Laonikos Chalkokondyles" [ref=f1e441] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Laonikos_Chalkokondyles
              - text: whose work was widely propagated by
              - link "Hieronymus Wolf" [ref=f1e442] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hieronymus_Wolf
              - text: .
              - superscript [ref=f1e443]:
                - link "[12]" [ref=f1e444] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEKaldellis2022a352-13"
              - text: "\"Byzantine\" was used adjectivally alongside terms such as \"Empire of the Greeks\" until the 19th century."
              - superscript [ref=f1e446]:
                - link "[13]" [ref=f1e447] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEKaldellis2022a352,_355,_357-14"
              - text: It is now the primary term, used to refer to all aspects of the empire; some modern historians believe it should not be used because it was originally a prejudicial and inaccurate term.
              - superscript [ref=f1e449]:
                - link "[14]" [ref=f1e450] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEKaldellis20232–3CormackHaldonJeffreys20084Stouraitis2022b20,_29,_31,_33–36Treadgold2025xiii–xiv-15"
          - region [ref=f1e452]:
            - heading "History" [level=2] [ref=f1e454]
            - note [ref=f1e455]:
              - text: "Main article:"
              - link "History of the Byzantine Empire" [ref=f1e456] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/History_of_the_Byzantine_Empire
            - figure [ref=f1e457]:
              - link [ref=f1e458] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Statua_di_Costantino_ai_musei_capitolini.jpg
              - generic [ref=f1e460]:
                - link "Constantine I" [ref=f1e461] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_I
                - text: ", also known as Constantine the Great, was"
                - link "Roman emperor" [ref=f1e462] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_emperor
                - text: from AD 306 to 337 and the first Roman emperor to convert to
                - link "Christianity" [ref=f1e463] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christianity
                - text: . He founded the city of
                - link "Constantinople" [ref=f1e464] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantinople
                - text: (now
                - link "Istanbul" [ref=f1e465] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Istanbul
                - text: ) and made it the capital of the Empire, which it remained for over a millennium.
            - region [ref=f1e466]:
              - heading "Start date" [level=3] [ref=f1e468]
              - paragraph [ref=f1e469]:
                - text: Given the significant overlap in historiographical
                - link "periodisations" [ref=f1e470] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Periodization
                - text: of
                - link "Late Roman history" [ref=f1e471] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Later_Roman_Empire
                - text: ","
                - link "late antiquity" [ref=f1e472] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Late_antiquity
                - text: ", and Byzantine history, there is no consensus on a foundation date for the Byzantine Empire. Scholarship with links to Greece or"
                - link "Eastern Orthodoxy" [ref=f1e473] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eastern_Orthodoxy
                - text: has customarily placed it in the early 300s.
                - superscript [ref=f1e474]:
                  - link "[15]" [ref=f1e475] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTECameron2002190–191-16"
                - text: The growth of the study of "late antiquity" has led to some historians setting a start date in the seventh or eighth centuries.
                - superscript [ref=f1e477]:
                  - link "[16]" [ref=f1e478] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTECameron2002166,_191Kaldellis2015Howard-Johnston20247-17"
                - text: Others believe a "new empire" began during changes c.
                - generic [ref=f1e480]: "300"
                - text: AD.
                - superscript [ref=f1e482]:
                  - link "[17]" [ref=f1e483] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis20233,_34-18"
                - text: Geoffrey Greatrex believes that it is impossible to precisely date the foundation of the Byzantine Empire.
                - superscript [ref=f1e485]:
                  - link "[18]" [ref=f1e486] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008232-19"
            - region [ref=f1e488]:
              - 'heading "Pre-518: Constantinian, Theodosian, and Leonid dynasties" [level=3] [ref=f1e490]'
              - note [ref=f1e491]:
                - text: "Further information:"
                - link "Byzantine Empire under the Constantinian and Valentinianic dynasties" [ref=f1e492] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Constantinian_and_Valentinianic_dynasties
                - text: ","
                - link "Byzantine Empire under the Theodosian dynasty" [ref=f1e493] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Theodosian_dynasty
                - text: ", and"
                - link "Byzantine Empire under the Leonid dynasty" [ref=f1e494] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Leonid_dynasty
              - figure [ref=f1e495]:
                - link [ref=f1e496] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Tetrarchy_map3.jpg
                  - img "A map showing the division of the Roman empire c. 300" [ref=f1e497]
                - generic [ref=f1e498]:
                  - text: Four-way division of the
                  - link "Roman Empire" [ref=f1e499] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Roman_Empire
                  - text: under the
                  - link "Tetrarchy" [ref=f1e500] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Tetrarchy
                  - text: system established by
                  - link "Diocletian" [ref=f1e501] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Diocletian
              - paragraph [ref=f1e502]:
                - text: Between the 3rd and 1st centuriesBC, the
                - link "Roman Republic" [ref=f1e504] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_Republic
                - text: established
                - link "hegemony" [ref=f1e505] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hegemony
                - text: over the
                - link "eastern Mediterranean" [ref=f1e506] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eastern_Mediterranean
                - text: ", while"
                - link "its government" [ref=f1e507] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ancient_Rome#Government
                - text: developed into the one-person rule of
                - link "an emperor" [ref=f1e508] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_emperors
                - text: .
                - superscript [ref=f1e509]:
                  - link "[19]" [ref=f1e510] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008233-20"
                - text: The
                - link "Roman Empire" [ref=f1e512] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_Empire
                - text: enjoyed a period of
                - link "relative stability" [ref=f1e513] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pax_Romana
                - text: until
                - link "the 3rd century AD" [ref=f1e514] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crisis_of_the_Third_Century
                - text: ", when external threats and internal crises caused it to splinter, as regional armies acclaimed their generals as \""
                - link "soldier-emperors" [ref=f1e515] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Barracks_emperor
                - text: "\"."
                - superscript [ref=f1e516]:
                  - link "[20]" [ref=f1e517] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008233Kaldellis202316–17Treadgold19977-21"
                - text: One of these,
                - link "Diocletian" [ref=f1e519] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Diocletian
                - text: (
                - generic [ref=f1e520]: r. 284–305
                - text: ), recognised that the state was too big to be ruled by a single person.
                - superscript [ref=f1e521]:
                  - link "[19]" [ref=f1e522] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008233-20"
                - text: He instituted the
                - link "Tetrarchy" [ref=f1e524] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tetrarchy
                - text: ", a system which divided the empire into eastern and western halves."
                - superscript [ref=f1e525]:
                  - link "[21]" [ref=f1e526] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis202317–18Treadgold199715,_17–18-22"
                - text: The Tetrarchy quickly failed, but the division of the empire proved an enduring concept.
                - superscript [ref=f1e528]:
                  - link "[22]" [ref=f1e529] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008235Kaldellis202317–18Treadgold199714-23"
              - paragraph [ref=f1e531]:
                - link "Constantine I" [ref=f1e532] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_I
                - text: (
                - generic [ref=f1e533]: r. 306–337
                - text: ) secured absolute power in 324.
                - superscript [ref=f1e534]:
                  - link "[23]" [ref=f1e535] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008235-24"
                - text: Over the next six years, he rebuilt the city of Byzantium as a new
                - link "capital" [ref=f1e537] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Capital_city
                - text: that he called "New Rome" (later named
                - link "Constantinople" [ref=f1e538] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantinople
                - text: ).
                - superscript [ref=f1e539]:
                  - link "[24]" [ref=f1e540] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008235Treadgold199739–40Kaldellis202318-25"
                - text: The old capital
                - link "Rome" [ref=f1e542] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rome
                - text: was farther from the prosperous eastern provinces and in a less strategically important location; its esteem had already been somewhat lessened in the eyes of the "soldier-emperors", who ruled from the frontiers, and of the empire's population.
                - superscript [ref=f1e543]:
                  - link "[25]" [ref=f1e544] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis202317,_20-26"
                - link "Having been granted citizenship" [ref=f1e546] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constitutio_Antoniniana
                - text: ", the empire's subjects considered themselves just as Roman as those in the city of Rome."
                - superscript [ref=f1e547]:
                  - link "[26]" [ref=f1e548] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis202318–20-27"
                - text: Constantine continued reforms of the empire's military and civil administration and instituted the
                - link "gold solidus" [ref=f1e550] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Solidus_(coin)
                - text: as a stable currency.
                - superscript [ref=f1e551]:
                  - link "[27]" [ref=f1e552] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008235–236Kaldellis202343–44-28"
                - text: He
                - link "favoured Christianity" [ref=f1e554] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_the_Great_and_Christianity
                - text: and became an opponent of paganism.
                - superscript [ref=f1e555]:
                  - link "[28]" [ref=f1e556] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008236–237Kaldellis202381–84Treadgold199731–33,_40–42-29"
                - text: Constantine's dynasty prioritised
                - link "a lengthy conflict" [ref=f1e558] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Perso-Roman_wars_of_337–361
                - text: against the comparably powerful
                - link "Sasanid Persia" [ref=f1e559] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sasanian_Empire
                - text: and ended in 363 with the death of his nephew
                - link "Julian" [ref=f1e560] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Julian_(emperor)
                - text: .
                - superscript [ref=f1e561]:
                  - link "[29]" [ref=f1e562] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008238Kaldellis202393,_98,_111–112Treadgold199752–53,_59–62-30"
                - text: The reign of the short
                - link "Valentinianic dynasty" [ref=f1e564] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valentinianic_dynasty
                - text: ", marked by"
                - link "wars against the Goths" [ref=f1e565] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gothic_Wars#Fourth_century
                - text: ", religious debates, and anti-corruption campaigns, ended in the East with the death of"
                - link "Valens" [ref=f1e566] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valens
                - text: at the
                - link "Battle of Adrianople" [ref=f1e567] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Adrianople
                - text: in 378.
                - superscript [ref=f1e568]:
                  - link "[30]" [ref=f1e569] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008239–240Kaldellis2023114–118,_121–123Treadgold199763–67-31"
              - figure "Division of the empire after the death of Theodosius I in 395 The Western Roman Empire The Byzantine/Eastern Roman Empire" [ref=f1e571]:
                - link [ref=f1e572] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Roman-empire-395AD.svg
                  - img "A map showing the Western and Eastern Roman empires c. 395, divided in the Balkans and North Africa" [ref=f1e573]
                - generic [ref=f1e574]:
                  - text: Division of the empire after the death of Theodosius I in 395
                  - generic [ref=f1e575]: The Western Roman Empire
                  - generic [ref=f1e577]: The Byzantine/Eastern Roman Empire
              - paragraph [ref=f1e579]:
                - text: Valens's successor,
                - link "Theodosius I" [ref=f1e580] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodosius_I
                - text: (
                - generic [ref=f1e581]: r. 379–395
                - text: ), secured peace in the east by allowing the
                - link "Goths" [ref=f1e582] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Goths
                - text: to settle in Roman territory;
                - superscript [ref=f1e583]:
                  - link "[31]" [ref=f1e584] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008240Kaldellis2023128–129Treadgold199773-32"
                - text: he also twice intervened in the western half, defeating the usurpers
                - link "Magnus Maximus" [ref=f1e586] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Magnus_Maximus
                - text: and
                - link "Eugenius" [ref=f1e587] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eugenius
                - text: in 388 and 394, respectively.
                - superscript [ref=f1e588]:
                  - link "[32]" [ref=f1e589] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008241Kaldellis2023129–130,_135–137Treadgold199774–75-33"
                - text: He
                - link "actively condemned paganism" [ref=f1e591] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Persecution_of_pagans_under_Theodosius_I
                - text: ", confirmed the primacy of"
                - link "Nicene Orthodoxy" [ref=f1e592] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nicene_Christianity
                - text: over
                - link "Arianism" [ref=f1e593] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arianism
                - text: in the East, and established
                - link "Christianity as the Roman state religion" [ref=f1e594] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christianity_as_the_Roman_state_religion
                - text: .
                - superscript [ref=f1e595]:
                  - link "[33]" [ref=f1e596] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008240–241Kaldellis2023126–128Treadgold199770–74-34"
                - text: He was the last emperor to rule both the western and eastern halves of the empire.
                - superscript [ref=f1e598]:
                  - link "[34]" [ref=f1e599] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023136-35"
                - text: After his death, the West was destabilised but the East thrived due to the civilian administrators who continued to hold power.
                - superscript [ref=f1e601]:
                  - link "[35]" [ref=f1e602] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023165Treadgold199787-36"
                - link "Theodosius II" [ref=f1e604] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodosius_II
                - text: (
                - generic [ref=f1e605]: r. 408–450
                - text: ) largely left the rule of the East to officials such as
                - link "Anthemius" [ref=f1e606] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthemius_(praetorian_prefect)
                - text: ", who constructed the"
                - link "Theodosian Walls" [ref=f1e607] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodosian_Walls
                - text: .
                - superscript [ref=f1e608]:
                  - link "[36]" [ref=f1e609] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023165–167,_244-37"
                - text: Constantinople had now entrenched itself as the empire's capital.
                - superscript [ref=f1e611]:
                  - link "[37]" [ref=f1e612] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008242Kaldellis202315,_20–21-38"
              - paragraph [ref=f1e614]:
                - text: Aside from Constantinople's walls, Theodosius' reign was also marked by the compilation of the
                - link "Codex Theodosianus" [ref=f1e616] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Codex_Theodosianus
                - superscript [ref=f1e617]:
                  - link "[38]" [ref=f1e618] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard200922-23Treadgold199791–92-39"
                - text: and the theological dispute over
                - link "Nestorianism" [ref=f1e620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nestorianism
                - text: (a doctrine later deemed
                - link "heretical" [ref=f1e621] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Heretical
                - text: ).
                - superscript [ref=f1e622]:
                  - link "[39]" [ref=f1e623] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008242Kaldellis2023173Treadgold199792-40"
                - text: His reign also saw the arrival of
                - link "Attila" [ref=f1e625] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Attila
                - text: "'s"
                - link "Huns" [ref=f1e626] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Huns
                - text: ", who ravaged the"
                - link "Balkans" [ref=f1e627] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Balkans
                - text: ", leading to a large"
                - link "tribute" [ref=f1e628] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tribute
                - text: being exacted from the eastern empire.
                - superscript [ref=f1e629]:
                  - link "[40]" [ref=f1e630] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023193–196Treadgold199794–95-41"
                - text: Attila switched his attention to the
                - link "rapidly-deteriorating western empire" [ref=f1e632] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fall_of_the_Western_Roman_Empire
                - text: ","
                - superscript [ref=f1e633]:
                  - link "[41]" [ref=f1e634] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023200Treadgold1997209-42"
                - text: and his people fractured after his death in 453.
                - superscript [ref=f1e636]:
                  - link "[42]" [ref=f1e637] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008-43"
                - text: Later,
                - link "Leo I" [ref=f1e639] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leo_I_(emperor)
                - text: (
                - generic [ref=f1e640]: r. 457–474
                - text: ) failed in his
                - link "468 attempt to reconquer" [ref=f1e641] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basiliscus#Military_career
                - text: the
                - link "West" [ref=f1e642] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fall_of_the_Western_Roman_Empire
                - text: .
                - superscript [ref=f1e643]:
                  - link "[43]" [ref=f1e644] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023209Greatrex2008243Treadgold1997153-44"
                - text: The warlord
                - link "Odoacer" [ref=f1e646] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Odoacer
                - text: deposed
                - link "Romulus Augustulus" [ref=f1e647] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romulus_Augustulus
                - text: in 476 and after the assassination of his titular successor
                - link "Julius Nepos" [ref=f1e648] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Julius_Nepos
                - text: in 480, abolished the office of western emperor.
                - superscript [ref=f1e649]:
                  - link "[44]" [ref=f1e650] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008244Kaldellis2023214Treadgold1997158–159-45"
              - paragraph [ref=f1e652]:
                - text: Through a combination of fortune and good political decisions, the Eastern Empire never experienced rebellious barbarian vassals or rule by barbarian warlords—the problems which ensured the downfall of the West.
                - superscript [ref=f1e653]:
                  - link "[45]" [ref=f1e654] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023243–245-46"
                - link "Zeno" [ref=f1e656] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zeno_(emperor)
                - text: (
                - generic [ref=f1e657]: r. 474–491
                - text: ) convinced the problematic
                - link "Ostrogoth" [ref=f1e658] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ostrogoth
                - text: king
                - link "Theodoric" [ref=f1e659] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodoric_the_Great
                - text: to take control of Italy from Odoacer;
                - superscript [ref=f1e660]:
                  - link "[46]" [ref=f1e661] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008244Kaldellis2023220Treadgold1997162,_164-47"
                - text: dying when the empire was at peace, he was succeeded by
                - link "Anastasius I" [ref=f1e663] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anastasius_I_Dicorus
                - text: (
                - generic [ref=f1e664]: r. 491–518
                - text: ).
                - superscript [ref=f1e665]:
                  - link "[47]" [ref=f1e666] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008244Kaldellis2023220Treadgold1997164-48"
                - text: His belief in
                - link "monophysitism" [ref=f1e668] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Monophysitism
                - text: brought occasional issues, but Anastasius was a capable administrator and instituted successful financial reforms including the abolition of the
                - link "chrysargyron tax" [ref=f1e669] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Collatio_lustralis
                - text: .
                - superscript [ref=f1e670]:
                  - link "[48]" [ref=f1e671] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGreatrex2008244Kaldellis2023224-49"
                - text: He was the first emperor since Diocletian not to face any serious problems affecting the empire during his reign.
                - superscript [ref=f1e673]:
                  - link "[49]" [ref=f1e674] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold1997172-50"
            - region [ref=f1e676]:
              - 'heading "518–717: Justinian and Heraclian dynasties" [level=3] [ref=f1e678]'
              - note [ref=f1e679]:
                - text: "Further information:"
                - link "Byzantine Empire under the Justinian dynasty" [ref=f1e680] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Justinian_dynasty
                - text: and
                - link "Byzantine Empire under the Heraclian dynasty" [ref=f1e681] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Heraclian_dynasty
              - generic [ref=f1e683]:
                - generic [ref=f1e684]:
                  - link [ref=f1e688] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Mosaic_of_Justinianus_I_-_Basilica_San_Vitale_(Ravenna).jpg
                    - img "A close up photograph of a mosaic of a person painted on a golden coloured background. The person has a dark brown cloth covering up his upper body till the neck, three jewels on his right shoulder, a crown with two pendants each hanging from both ends and an aura like circle around his head" [ref=f1e689]
                  - link [ref=f1e693] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Belisarius_mosaic.jpg
                    - img "A close up photograph of a mosaic of a person painted on a golden coloured background. The person has a white cloth covering up his upper body till the neck, an embroidered pattern on his right shoulder, wavy hair, a stubble beard and a moustache" [ref=f1e694]
                - generic [ref=f1e696]:
                  - text: Emperor
                  - link "Justinian I" [ref=f1e697] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Justinian_I
                  - text: (left) and his general
                  - link "Belisarius" [ref=f1e698] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Belisarius
                  - text: (right).
                  - link "Mosaics" [ref=f1e699] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mosaic
                  - text: ", 6th century, from the"
                  - link "Basilica of San Vitale" [ref=f1e700] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Basilica_of_San_Vitale
                  - text: ", Ravenna, Italy"
              - paragraph [ref=f1e701]:
                - text: The reign of
                - link "Justinian I" [ref=f1e702] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Justinian_I
                - text: was a high point in east Roman history.
                - superscript [ref=f1e703]:
                  - link "[50]" [ref=f1e704] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a250-51"
                - text: Following his accession in 527, the legal code was rewritten as the
                - link "Corpus Juris Civilis" [ref=f1e707] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Corpus_Juris_Civilis
                - text: ", which streamlined Roman law across the empire;"
                - superscript [ref=f1e708]:
                  - link "[51]" [ref=f1e709] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2009a108–109Kaldellis2023269–271Treadgold1997179-52"
                - text: he reasserted imperial control over religion and morality through purges of pagans, heretics, and other "deviants";
                - superscript [ref=f1e711]:
                  - link "[52]" [ref=f1e712] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023272Louth2009a116Treadgold199780-53"
                - text: and having ruthlessly subdued
                - link "the 532 Nika revolt" [ref=f1e714] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nika_riots
                - text: he rebuilt much of Constantinople, including the
                - link "Hagia Sophia" [ref=f1e715] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hagia_Sophia
                - text: .
                - superscript [ref=f1e716]:
                  - link "[53]" [ref=f1e717] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2009a111,_120Kaldellis2023274–276-54"
                - text: Justinian I took advantage of the confusion, following Theoderic the Ostrogoth's death, to attempt the reconquest of Italy.
                - superscript [ref=f1e719]:
                  - link "[54]" [ref=f1e720] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a252-55"
                - text: The
                - link "Vandal Kingdom" [ref=f1e722] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vandal_Kingdom
                - text: in North Africa
                - link "was subjugated in late 533" [ref=f1e723] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vandalic_War
                - text: by the general
                - link "Belisarius" [ref=f1e724] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Belisarius
                - text: ","
                - superscript [ref=f1e725]:
                  - link "[55]" [ref=f1e726] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023281Moorhead2009202-56"
                - text: who
                - link "then invaded Italy" [ref=f1e728] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gothic_War_(535–554)
                - text: ; the
                - link "Ostrogothic Kingdom" [ref=f1e729] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ostrogothic_Kingdom
                - text: mostly ended in 554.
                - superscript [ref=f1e730]:
                  - link "[56]" [ref=f1e731] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023306Moorhead2009209Haldon2008a253-57"
              - paragraph [ref=f1e733]:
                - text: In the 540s, Justinian began to suffer reversals on multiple fronts.
                - superscript [ref=f1e734]:
                  - link "[57]" [ref=f1e735] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023297-58"
                - text: Capitalising on Constantinople's preoccupation with the West,
                - link "Khosrow I" [ref=f1e737] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Khosrow_I
                - text: of the Sasanian Empire invaded Byzantine territory and sacked
                - link "Antioch" [ref=f1e738] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Antioch
                - text: in 540.
                - superscript [ref=f1e739]:
                  - link "[58]" [ref=f1e740] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023297Treadgold1997193–194Haldon2008a252–253-59"
                - link "A devastating plague" [ref=f1e742] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Plague_of_Justinian
                - text: killed a large proportion of the population and severely reduced the empire's social and financial stability.
                - superscript [ref=f1e743]:
                  - link "[59]" [ref=f1e744] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023300–301-60"
                - text: The most difficult period of the Ostrogothic war, against their king
                - link "Totila" [ref=f1e746] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Totila
                - text: ", came during this decade;"
                - superscript [ref=f1e747]:
                  - link "[60]" [ref=f1e748] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023305-61"
                - text: while divisions among Justinian's advisors undercut the administration's response.
                - superscript [ref=f1e750]:
                  - link "[61]" [ref=f1e751] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold1997197–198,_201Kaldellis2023298,_305–306-62"
                - text: He also did not fully heal the divisions in
                - link "Chalcedonian Christianity" [ref=f1e753] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chalcedonian_Christianity
                - text: ", as the"
                - link "fifth ecumenical council" [ref=f1e754] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Second_Council_of_Constantinople
                - text: failed to make a real difference.
                - superscript [ref=f1e755]:
                  - link "[62]" [ref=f1e756] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold1997210–211,_214Louth2009a117–118Haldon2008a253-63"
                - text: Justinian died in 565; his reign was more successful than any other emperor, yet he left behind an unstable empire.
                - superscript [ref=f1e758]:
                  - link "[63]" [ref=f1e759] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023318–319Treadgold1997217-64"
              - paragraph [ref=f1e761]:
                - link "Justin II" [ref=f1e762] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Justin_II
                - text: (
                - generic [ref=f1e763]: r. 565–578
                - text: ) inherited an empire stretched thin both financially and territorially.
                - superscript [ref=f1e764]:
                  - link "[64]" [ref=f1e765] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a254-65"
                - text: He was soon at war on many fronts.
                - superscript [ref=f1e767]:
                  - link "[65]" [ref=f1e768] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a254Treadgold1997-66"
                - text: Fearing the aggressive
                - link "Avars" [ref=f1e770] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pannonian_Avars
                - text: ", the"
                - link "Lombards" [ref=f1e771] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lombards
                - text: conquered much of northern Italy by 572.
                - superscript [ref=f1e772]:
                  - link "[66]" [ref=f1e773] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a254Treadgold1997220–221-67"
                - text: The
                - link "Sasanian wars restarted" [ref=f1e775] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Sasanian_War_of_572–591
                - text: in the same year, and would not conclude until 591;
                - superscript [ref=f1e776]:
                  - link "[64]" [ref=f1e777] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a254-65"
                - text: by this time, the Avars and
                - link "Slavs had repeatedly invaded the Balkans" [ref=f1e779] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Slavic_migrations_to_the_Balkans
                - text: ", causing great instability."
                - superscript [ref=f1e780]:
                  - link "[67]" [ref=f1e781] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2009a126–127Haldon2008a254Kaldellis2023336-68"
                - link "Maurice" [ref=f1e783] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maurice_(emperor)
                - link "campaigned extensively in the region" [ref=f1e784] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maurice's_Balkan_campaigns
                - text: during the 590s, and although he re-established Byzantine control up to the
                - link "Danube" [ref=f1e785] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Danube_River
                - text: ", he pushed his troops too far in 602—they mutinied, proclaimed an officer named"
                - link "Phocas" [ref=f1e786] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Phocas
                - text: as emperor, and executed Maurice.
                - superscript [ref=f1e787]:
                  - link "[68]" [ref=f1e788] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023336–338Treadgold1997234–235Haldon2008a254-69"
                - text: The Sasanians seized their moment and
                - link "reopened hostilities" [ref=f1e790] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Sasanian_War_of_602–628
                - text: ;
                - superscript [ref=f1e791]:
                  - link "[69]" [ref=f1e792] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023347–348Louth2009b226-70"
                - text: Phocas was unable to cope and soon faced
                - link "a major rebellion" [ref=f1e794] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Heraclian_revolt
                - text: led by
                - link "Heraclius" [ref=f1e795] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Heraclius
                - text: .
                - superscript [ref=f1e796]:
                  - link "[70]" [ref=f1e797] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023348-71"
                - text: Phocas lost Constantinople in 610 and was executed;
                - superscript [ref=f1e799]:
                  - link "[71]" [ref=f1e800] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a254Louth2009b226-72"
                - text: this destructive civil war accelerated the empire's decline.
                - superscript [ref=f1e802]:
                  - link "[72]" [ref=f1e803] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023349Treadgold1997241-73"
              - figure [ref=f1e805]:
                - link [ref=f1e806] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Walls_of_Constantinople.JPG
                  - img "A photograph of a large double-layered fortification." [ref=f1e807]
                - generic [ref=f1e808]:
                  - text: The
                  - link "Theodosian Walls" [ref=f1e809] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Walls_of_Constantinople
                  - text: of Constantinople, very important during the
                  - link "717–718 siege" [ref=f1e810] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(717–718)
              - paragraph [ref=f1e811]:
                - text: Under
                - link "Khosrow II" [ref=f1e812] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Khosrow_II
                - text: ", the Sassanids occupied the"
                - link "Levant" [ref=f1e813] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Levant
                - text: and Egypt and advanced into Asia Minor, and the Avars and Slavs raided in the Balkans.
                - superscript [ref=f1e814]:
                  - link "[73]" [ref=f1e815] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a254–255Treadgold1997290–293Kaldellis2023352,_355–356,_360-74"
                - text: The Empire's control of Italy also weakened.
                - superscript [ref=f1e817]:
                  - link "[74]" [ref=f1e818] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a254–255-75"
                - text: After successfully repelling
                - link "a siege of Constantinople" [ref=f1e820] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(626)
                - text: in 626,
                - superscript [ref=f1e821]:
                  - link "[75]" [ref=f1e822] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a255-76"
                - text: Heraclius won a decisive victory at the
                - link "Battle of Nineveh" [ref=f1e824] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Nineveh_(627)
                - text: ","
                - superscript [ref=f1e825]:
                  - link "[76]" [ref=f1e826] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold1997398-77"
                - text: eventually defeating the Sassanids later that year.
                - superscript [ref=f1e828]:
                  - link "[77]" [ref=f1e829] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023365–366Louth2009b227–229-78"
                - text: The triumph would prove short-lived.
                - superscript [ref=f1e831]:
                  - link "[78]" [ref=f1e832] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2009b229Kaldellis2023372-79"
                - text: The
                - link "Arab conquests" [ref=f1e834] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Early_Muslim_conquests
                - text: soon saw the
                - link "conquest of the Levant" [ref=f1e835] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Muslim_conquest_of_the_Levant
                - text: ","
                - link "Egypt" [ref=f1e836] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arab_conquest_of_Egypt
                - text: ", and"
                - link "the Sassanid Empire" [ref=f1e837] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Muslim_conquest_of_Persia
                - text: by the newly formed Arab
                - link "Rashidun Caliphate" [ref=f1e838] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rashidun_Caliphate
                - text: .
                - superscript [ref=f1e839]:
                  - link "[79]" [ref=f1e840] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023375Haldon2008a256Louth2009b229–230-80"
                - text: By Heraclius' death in 641, the empire had been severely reduced economically and territorially—the loss of the wealthy eastern provinces had deprived the empire of as much as three-quarters of its revenue.
                - superscript [ref=f1e842]:
                  - link "[80]" [ref=f1e843] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023387Haldon2008a256-81"
              - paragraph [ref=f1e845]:
                - text: The next century is poorly documented.
                - superscript [ref=f1e846]:
                  - link "[81]" [ref=f1e847] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023387-82"
                - link "Arab raids into Asia Minor" [ref=f1e849] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arab–Byzantine_wars#Arab_attacks_on_Anatolia_and_sieges_of_Constantinople
                - text: started quickly, and the Empire responded by holding fortified centres and avoiding battle wherever possible.
                - superscript [ref=f1e850]:
                  - link "[82]" [ref=f1e851] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a257Kaldellis2023387-83"
                - text: Although Anatolia was invaded annually, it avoided permanent Arab occupation.
                - superscript [ref=f1e853]:
                  - link "[81]" [ref=f1e854] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023387-82"
                - text: The outbreak of the
                - link "First Fitna" [ref=f1e856] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First_Fitna
                - text: "in 656 gave the Empire breathing space, which it used sensibly:"
                - superscript [ref=f1e857]:
                  - link "[83]" [ref=f1e858] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023389-84"
                - text: some order was restored in the Balkans by
                - link "Constans II" [ref=f1e860] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constans_II
                - text: (
                - generic [ref=f1e861]: r. 641–668
                - text: )
                - superscript [ref=f1e862]:
                  - link "[84]" [ref=f1e863] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2009b230–231-85"
                - text: following his administrative reorganisation which over time evolved into the "
                - link "theme system" [ref=f1e865] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theme_(Byzantine_district)
                - text: "\", a structure that allocated troops to defend specific provinces."
                - superscript [ref=f1e866]:
                  - link "[85]" [ref=f1e867] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold1997315–316Louth2009b239–240-86"
                - link "Constantine IV" [ref=f1e869] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_IV
                - text: (
                - generic [ref=f1e870]: r. 668–685
                - text: ) repelled the Arab efforts to
                - link "capture Constantinople in the 670s" [ref=f1e871] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(674–678)
                - text: using
                - link "Greek fire" [ref=f1e872] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_fire
                - text: ","
                - superscript [ref=f1e873]:
                  - link "[86]" [ref=f1e874] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold1997323–327Haldon2008a258Louth2009b233-87"
                - text: but suffered a reversal against the
                - link "Bulgars" [ref=f1e876] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bulgars
                - text: ", who soon established"
                - link "an empire in the northern Balkans" [ref=f1e877] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First_Bulgarian_Empire
                - text: .
                - superscript [ref=f1e878]:
                  - link "[87]" [ref=f1e879] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023403Haldon2008a257–258Louth2009b233-88"
                - text: Nevertheless, he had done enough to secure the empire's position,
                - superscript [ref=f1e881]:
                  - link "[88]" [ref=f1e882] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2009b235-89"
                - text: especially as the
                - link "Umayyad Caliphate" [ref=f1e884] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Umayyad_Caliphate
                - text: was undergoing
                - link "another civil war" [ref=f1e885] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Second_Fitna
                - text: .
                - superscript [ref=f1e886]:
                  - link "[89]" [ref=f1e887] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023403-90"
              - paragraph [ref=f1e889]:
                - text: Beginning in 695, when Constantine's son
                - link "Justinian II" [ref=f1e890] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Justinian_II
                - text: was first deposed, the empire entered an
                - link "era of political instability" [ref=f1e891] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Twenty_Years'_Anarchy
                - text: that lasted for the next 22 years.
                - superscript [ref=f1e892]:
                  - link "[90]" [ref=f1e893] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a257Kaldellis2023438–440Auzépy2009265-91"
                - text: While Justinian had stabilised the situation with the divided Arabs,
                - superscript [ref=f1e895]:
                  - link "[91]" [ref=f1e896] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a257-92"
                - text: the threat of the reconstituted caliphate was met by
                - link "Leo III" [ref=f1e898] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leo_III_the_Isaurian
                - text: when he
                - link "repelled the 717–718 siege" [ref=f1e899] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(717–718)
                - text: ", the first serious challenge against Arab expansion."
                - superscript [ref=f1e900]:
                  - link "[92]" [ref=f1e901] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a257Auzépy2009265-93"
            - region [ref=f1e903]:
              - 'heading "718–867: Isaurian, Nikephorian, and Amorian dynasties" [level=3] [ref=f1e905]'
              - note [ref=f1e906]:
                - text: "Further information:"
                - link "Byzantine Empire under the Isaurian dynasty" [ref=f1e907] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Isaurian_dynasty
                - text: ","
                - link "Byzantine Empire under the Nikephorian dynasty" [ref=f1e908] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Nikephorian_dynasty
                - text: ", and"
                - link "Byzantine Empire under the Amorian dynasty" [ref=f1e909] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Amorian_dynasty
              - figure [ref=f1e910]:
                - link [ref=f1e911] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Solidus-Leo_III_and_Constantine_V-sb1504.jpg
                  - img "Two gold coins, each depicting a man" [ref=f1e912]
                - generic [ref=f1e913]:
                  - text: Gold solidus of
                  - link "Leo III" [ref=f1e914] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Leo_III_the_Isaurian
                  - text: (left) and his son and heir,
                  - link "Constantine V" [ref=f1e915] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Constantine_V
                  - text: (right)
              - paragraph [ref=f1e916]:
                - text: The emperors Leo III (
                - generic [ref=f1e917]: r. 717–741
                - text: ) and
                - link "Constantine V" [ref=f1e918] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_V
                - text: (
                - generic [ref=f1e919]: r. 741–775
                - text: ) were effective leaders, both in government and warfare.
                - superscript [ref=f1e920]:
                  - link "[93]" [ref=f1e921] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a258–259Kaldellis2023443-94"
                - text: They withstood continued Arab attacks,
                - superscript [ref=f1e923]:
                  - link "[94]" [ref=f1e924] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a257Auzépy2009255-95"
                - text: as well as civil war and natural disasters.
                - superscript [ref=f1e926]:
                  - link "[95]" [ref=f1e927] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023450–451Auzépy2009255,_258–259-96"
                - text: Constantine's success reestablished the state as a major regional power.
                - superscript [ref=f1e929]:
                  - link "[96]" [ref=f1e930] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a259-97"
                - text: Leo's reign produced the
                - link "Ekloge ton nomon" [ref=f1e933] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ekloge_ton_nomon
                - text: ", a code of law that evolved that of Justinian I."
                - superscript [ref=f1e934]:
                  - link "[97]" [ref=f1e935] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023444–445Auzépy2009275–276-98"
                - text: He also continued to reform the theme system in order to lead offensive campaigns against the Muslims,
                - superscript [ref=f1e937]:
                  - link "[98]" [ref=f1e938] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAuzépy2009-99"
                - text: culminating in
                - link "a notable victory in 740" [ref=f1e940] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Akroinon
                - text: .
                - superscript [ref=f1e941]:
                  - link "[99]" [ref=f1e942] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAuzépy2009265–269Kaegi2009386Kaldellis2023450-100"
                - text: Constantine overcame an early civil war against his brother-in-law
                - link "Artabasdos" [ref=f1e944] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Artabasdos
                - text: ", created stability against the new"
                - link "Abbasid Caliphate" [ref=f1e945] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Abbasid_Caliphate
                - text: ","
                - link "campaigned successfully" [ref=f1e946] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_V#Repeated_campaigns_against_the_Bulgarians
                - text: against the Bulgars, and continued to make administrative and military reforms.
                - superscript [ref=f1e947]:
                  - link "[100]" [ref=f1e948] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a260Kaldellis2023450–451,_453–454-101"
                - text: Both emperors supported
                - link "iconoclast" [ref=f1e950] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Iconoclasm
                - text: policies opposing the veneration of
                - link "religious images" [ref=f1e951] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Icon
                - text: ", which had them later vilified by biased authors, creating issues that continue to impact modern scholarship;"
                - superscript [ref=f1e952]:
                  - link "[101]" [ref=f1e953] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023443,_447–449Haldon2008a258,_260–261Auzépy2009253–254-102"
                - text: Constantine's reign also saw the loss of
                - link "Ravenna" [ref=f1e955] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ravenna
                - text: to the
                - link "Lombards" [ref=f1e956] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kingdom_of_the_Lombards
                - text: ", and the beginning of a split from the"
                - link "Roman papacy" [ref=f1e957] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Papal_States
                - text: .
                - superscript [ref=f1e958]:
                  - link "[102]" [ref=f1e959] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023459–461Auzépy2009284–287-103"
              - paragraph [ref=f1e961]:
                - text: In 780, Empress
                - link "Irene" [ref=f1e962] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Irene_of_Athens
                - text: assumed power as regent for her son
                - link "Constantine VI" [ref=f1e963] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_VI
                - text: .
                - superscript [ref=f1e964]:
                  - link "[103]" [ref=f1e965] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a261Treadgold2002141–142Magdalino2002170-104"
                - text: Although she was a capable administrator who restored the veneration of icons,
                - superscript [ref=f1e967]:
                  - link "[104]" [ref=f1e968] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008a261Kaldellis2023464–469-105"
                - text: the empire was destabilised by her conflict with her son. The Bulgars and Abbasids inflicted numerous defeats on the Byzantine armies, and the papacy crowned
                - link "Charlemagne" [ref=f1e970] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charlemagne
                - text: as Roman emperor in 800.
                - superscript [ref=f1e971]:
                  - link "[105]" [ref=f1e972] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023470–473Magdalino2002169–171Haldon2008a261-106"
                - text: In 802, the unpopular Irene was overthrown by
                - link "Nikephoros I" [ref=f1e974] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nikephoros_I
                - text: ; he reformed the empire's administration but died
                - link "in battle against the Bulgars" [ref=f1e975] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Pliska
                - text: in 811.
                - superscript [ref=f1e976]:
                  - link "[106]" [ref=f1e977] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023473–474,_478–481-107"
                - text: Military defeats and societal disorder, especially the resurgence of iconoclasm, characterised the next eighteen years.
                - superscript [ref=f1e979]:
                  - link "[107]" [ref=f1e980] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008265Auzépy2009257,_259,_289Kaldellis2023482–483,_485–491-108"
              - figure "The Byzantine Empire c. 814" [ref=f1e982]:
                - link [ref=f1e983] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Byzantine_Empire_814.svg
                  - img "Map centred on Western Europe. The territories of the Byzantine Empire are shaded dark green; namely the Italian islands, southern Greece, south-central Bulgaria, southern Crimea and most of Turkey." [ref=f1e984]
                - generic [ref=f1e985]:
                  - text: The Byzantine Empire c.
                  - generic [ref=f1e986]: "814"
              - paragraph [ref=f1e987]:
                - text: Stability was somewhat restored during the reign of
                - link "Theophilos" [ref=f1e988] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theophilos_(emperor)
                - text: (
                - generic [ref=f1e989]: r. 829–842
                - text: ). He capitalised on economic growth to complete construction programmes, including rebuilding the
                - link "sea walls of Constantinople" [ref=f1e990] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Walls_of_Constantinople#Sea_walls
                - text: ", overhaul provincial governance, and wage inconclusive campaigns against the Abbasids."
                - superscript [ref=f1e991]:
                  - link "[108]" [ref=f1e992] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023491–495Holmes2008265Auzépy2009273–274-109"
                - text: After his death, his empress
                - link "Theodora" [ref=f1e994] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodora_(wife_of_Theophilos)
                - text: ", ruling on behalf of her son"
                - link "Michael III" [ref=f1e995] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_III
                - text: ", permanently restored the veneration of icons;"
                - superscript [ref=f1e996]:
                  - link "[109]" [ref=f1e997] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023498–501Holmes2008266-110"
                - text: the empire prospered under their sometimes-fraught rule. Michael was posthumously vilified by historians loyal to the dynasty of his successor
                - link "Basil I" [ref=f1e999] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basil_I
                - text: ", who had him assassinated in 867 and later benefited from successes begun under his predecessor."
                - superscript [ref=f1e1000]:
                  - link "[110]" [ref=f1e1001] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008265–266Kaldellis2023504–505Auzépy2009254Tougher2009292–293,_296-111"
            - region [ref=f1e1003]:
              - 'heading "867–1081: Macedonian and Doukas dynasties" [level=3] [ref=f1e1005]'
              - note [ref=f1e1006]:
                - text: "Further information:"
                - link "Byzantine Empire under the Macedonian dynasty" [ref=f1e1007] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Macedonian_dynasty
                - text: and
                - link "Byzantine Empire under the Doukas dynasty" [ref=f1e1008] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Doukas_dynasty
              - paragraph [ref=f1e1009]:
                - text: Basil I (
                - generic [ref=f1e1010]: r. 867–886
                - text: ) continued Michael's policies.
                - superscript [ref=f1e1011]:
                  - link "[111]" [ref=f1e1012] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETougher2009292,_296Holmes2008266-112"
                - text: His armies campaigned with mixed results in Italy but
                - link "defeated" [ref=f1e1014] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Bathys_Ryax
                - text: the
                - link "Paulicians of Tephrike" [ref=f1e1015] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paulician_principality_of_Tephrike
                - text: .
                - superscript [ref=f1e1016]:
                  - link "[112]" [ref=f1e1017] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008266Kaldellis2023522–524Treadgold1997455–458-113"
                - text: His successor
                - link "Leo VI" [ref=f1e1019] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leo_VI_the_Wise
                - text: (
                - generic [ref=f1e1020]: r. 886–912
                - text: )
                - superscript [ref=f1e1021]:
                  - link "[b]" [ref=f1e1022] [cursor=pointer]:
                    - /url: "#cite_note-115"
                - text: sponsored, compiled, and issued a large body of written works. These included the
                - link "Basilika" [ref=f1e1025] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basilika
                - text: ", a Greek translation of Justinian I's legal corpus that incorporated Leo's new laws; the"
                - link "Tactica" [ref=f1e1027] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tactica_of_Emperor_Leo_VI_the_Wise
                - text: ", a military treatise; and the"
                - link "Book of the Eparch" [ref=f1e1029] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Book_of_the_Prefect
                - text: ", a manual on Constantinople's trading regulations."
                - superscript [ref=f1e1030]:
                  - link "[114]" [ref=f1e1031] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard2009b493,_496–498Kaldellis2023429–433Holmes2008267-116"
                - text: "Outside these literary, legal, and administrative projects, Leo's reign was less successful: the empire was"
                - link "defeated by the Bulgarians" [ref=f1e1033] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Boulgarophygon
                - text: and
                - link "lost Taormina" [ref=f1e1034] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Taormina_(902)
                - text: ", its last outpost on Sicily."
                - superscript [ref=f1e1035]:
                  - link "[115]" [ref=f1e1036] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008267Kaldellis2023534–535-117"
                - text: He also provoked theological scandal by marrying four times in an attempt to father a legitimate heir.
                - superscript [ref=f1e1038]:
                  - link "[116]" [ref=f1e1039] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023537–539Holmes2008267Shepard2009b503-118"
              - paragraph [ref=f1e1041]:
                - text: The early reign of this heir,
                - link "Constantine VII" [ref=f1e1042] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_VII
                - text: ", was tumultuous, as his mother"
                - link "Zoe" [ref=f1e1043] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zoe_Karbonopsina
                - text: ", his uncle"
                - link "Alexander" [ref=f1e1044] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alexander_(Byzantine_emperor)
                - text: ", the patriarch"
                - link "Nicholas" [ref=f1e1045] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nicholas_Mystikos
                - text: ", members of leading aristocratic families, and the powerful external pressure of"
                - link "Simeon I of Bulgaria" [ref=f1e1046] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Simeon_I_of_Bulgaria
                - text: shaped the struggle for power.
                - superscript [ref=f1e1047]:
                  - link "[117]" [ref=f1e1048] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard2009b505Kaldellis2023540–543Holmes2008267-119"
                - text: In 920, the admiral
                - link "Romanos I" [ref=f1e1050] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romanos_I_Lekapenos
                - text: used his fleet to secure power, crowning himself and demoting Constantine to the position of junior co-emperor.
                - superscript [ref=f1e1051]:
                  - link "[118]" [ref=f1e1052] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023543–544Shepard2009b505–507-120"
                - text: His reign, marked by
                - link "the end of the war against Bulgaria" [ref=f1e1054] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Bulgarian_war_of_913–927#Peace_treaty
                - text: and successes in the east under the general
                - link "John Kourkouas" [ref=f1e1055] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_Kourkouas
                - text: ", ended in 944 when his sons deposed him; Constantine then removed them and ruled as sole emperor."
                - superscript [ref=f1e1056]:
                  - link "[119]" [ref=f1e1057] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard2009b508–509Kaldellis2023546–552Holmes2008268-121"
                - text: Constantine's politically limited sole rule is often associated with the
                - link "Macedonian Renaissance" [ref=f1e1059] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Macedonian_Renaissance
                - text: ", but many of the works compiled at his court were also intended to legitimise and glorify the"
                - link "Macedonian dynasty" [ref=f1e1060] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Macedonian_dynasty
                - text: .
                - superscript [ref=f1e1061]:
                  - link "[120]" [ref=f1e1062] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023553–555Holmes2008268-122"
                - link "His son and successor" [ref=f1e1064] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romanos_II
                - text: died young; under two soldier-emperors,
                - link "Nikephoros II" [ref=f1e1065] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nikephoros_II_Phokas
                - text: (
                - generic [ref=f1e1066]: r. 963–969
                - text: ) and
                - link "John I Tzimiskes" [ref=f1e1067] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_I_Tzimiskes
                - text: (
                - generic [ref=f1e1068]: r. 969–976
                - text: ), the army claimed numerous military successes, including the
                - link "conquest of Cilicia" [ref=f1e1069] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_conquest_of_Cilicia
                - text: and
                - link "Antioch" [ref=f1e1070] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Antioch_(968–969)
                - text: ", and a"
                - link "victory against Bulgaria and the Kievan Rus'" [ref=f1e1071] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sviatoslav's_invasion_of_Bulgaria
                - text: in 971. John in particular was an effective soldier-emperor who introduced frontier military reforms and pursued successful fiscal and diplomatic policies.
                - superscript [ref=f1e1072]:
                  - link "[121]" [ref=f1e1073] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023563–573Holmes2008268–269Magdalino2002176-123"
              - figure [ref=f1e1075]:
                - link [ref=f1e1076] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Map_Byzantine_Empire_1025-en.svg
                - generic [ref=f1e1078]:
                  - text: Territorial extent of the Byzantine Empire at the time of
                  - link "Basil II" [ref=f1e1079] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Basil_II
                  - text: "'s death in 1025"
              - paragraph [ref=f1e1080]:
                - text: After John's death, Constantine VII's grandsons
                - link "Basil II" [ref=f1e1081] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basil_II
                - text: and
                - link "Constantine VIII" [ref=f1e1082] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_VIII
                - text: ruled jointly for half a century, although the latter exercised little real power.
                - superscript [ref=f1e1083]:
                  - link "[122]" [ref=f1e1084] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008268-124"
                - text: Their early reign was occupied by conflicts against two prominent generals,
                - link "Bardas Skleros" [ref=f1e1086] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bardas_Skleros
                - text: and
                - link "Bardas Phokas" [ref=f1e1087] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bardas_Phokas_the_Younger
                - text: ", which ended in 989 after Phokas's death and Skleros's submission, and by a power struggle against the eunuch"
                - link "Basileios" [ref=f1e1088] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basil_Lekapenos
                - text: ", who was dismissed in 985."
                - superscript [ref=f1e1089]:
                  - link "[123]" [ref=f1e1090] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard2009b522–526Magdalino2002202Kaldellis2023573–578-125"
                - text: "Basil, who never married or had children, subsequently refused to delegate much authority: he took personal command of the army, sidelined established military families, and promoted officers loyal to him."
                - superscript [ref=f1e1092]:
                  - link "[124]" [ref=f1e1093] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard2009b526,_531Kaldellis2023578–579Holmes2008269-126"
                - text: His reign witnessed
                - link "the decades-long campaign against Bulgaria" [ref=f1e1095] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_conquest_of_Bulgaria
                - text: ", in which the"
                - link "Battle of Kleidion" [ref=f1e1096] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Kleidion
                - text: in 1014 proved decisive before the final Byzantine conquest in 1018.
                - superscript [ref=f1e1097]:
                  - link "[125]" [ref=f1e1098] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008269Shepard2009b526–29Kaldellis2023579–582-127"
                - text: Diplomatic efforts, critical for this success,
                - superscript [ref=f1e1100]:
                  - link "[126]" [ref=f1e1101] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard2009b529Holmes2008271-128"
                - text: also contributed to the annexation of Caucasian territories in the 1020s and coexistence with the new
                - link "Fatimid Caliphate" [ref=f1e1103] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fatimid_Caliphate
                - text: .
                - superscript [ref=f1e1104]:
                  - link "[127]" [ref=f1e1105] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023584Holmes2008270–271Magdalino2002180-129"
                - text: When he died in 1025, Basil's empire stretched from the Danube and southern Italy in the west to the
                - link "Euphrates" [ref=f1e1107] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Euphrates
                - text: in the east; his rapid expansion was not matched by comparable administrative reforms.
                - superscript [ref=f1e1108]:
                  - link "[128]" [ref=f1e1109] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShepard2009b531–536Holmes2008271-130"
              - figure [ref=f1e1111]:
                - link [ref=f1e1112] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:The_seizure_of_Edessa_in_Syria_by_the_Byzantine_army_and_the_Arabic_counterattack_from_the_Chronicle_of_John_Skylitzes.jpg
                  - img "Depiction of an army attacking a walled town" [ref=f1e1113]
                - generic [ref=f1e1114]:
                  - text: The seizure of
                  - link "Edessa" [ref=f1e1115] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Edessa
                  - text: (1031) by the Byzantines under
                  - link "George Maniakes" [ref=f1e1116] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/George_Maniakes
                  - text: and the counterattack by the
                  - link "Seljuk Turks" [ref=f1e1117] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Seljuk_Turks
              - paragraph [ref=f1e1118]:
                - text: After Constantine VIII's death in 1028, his daughters, the empresses
                - link "Zoe" [ref=f1e1119] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zoe_Porphyrogenita
                - text: (
                - generic [ref=f1e1120]: r. 1028–1050
                - text: ) and
                - link "Theodora" [ref=f1e1121] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodora_Porphyrogenita
                - text: (
                - generic [ref=f1e1122]: r. 1042–1056
                - text: "), held the keys to power: four emperors ("
                - link "Romanos III" [ref=f1e1123] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romanos_III_Argyros
                - text: ","
                - link "Michael IV" [ref=f1e1124] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_IV_the_Paphlagonian
                - text: ","
                - link "Michael V" [ref=f1e1125] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_V_Kalaphates
                - text: ", and"
                - link "Constantine IX" [ref=f1e1126] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_IX_Monomachos
                - text: ) ruled only because of their connection to Zoe, while
                - link "Michael VI" [ref=f1e1127] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_VI_Bringas
                - text: (
                - generic [ref=f1e1128]: r. 1056–1057
                - text: ) was selected by Theodora.
                - superscript [ref=f1e1129]:
                  - link "[129]" [ref=f1e1130] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMagdalino2002202–203Holmes2008271–272Angold2009587–588Kaldellis2023588–589-131"
                - text: Political instability, budget deficits, expensive military failures, and problems connected to over-extension strained imperial finances, legitimacy, and frontier defence;
                - superscript [ref=f1e1132]:
                  - link "[130]" [ref=f1e1133] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023590,_593Magdalino2002181–182Angold2009587–598-132"
                - text: the empire's strategic focus moved from maintaining hegemony to prioritising defence.
                - superscript [ref=f1e1135]:
                  - link "[131]" [ref=f1e1136] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023602-133"
              - paragraph [ref=f1e1138]:
                - text: The empire soon came under sustained assault on three fronts, from the
                - link "Seljuk Turks in the east" [ref=f1e1139] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Seljuk_wars
                - text: ", the"
                - link "Pecheneg nomads" [ref=f1e1140] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pechenegs
                - text: in the north, and the
                - link "Normans in the west" [ref=f1e1141] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Norman_conquest_of_southern_Italy
                - text: . The Byzantine army struggled to confront these enemies, whose raids, settlement patterns, and military organisation made them difficult to defeat through single set-piece battles.
                - superscript [ref=f1e1142]:
                  - link "[132]" [ref=f1e1143] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008272–273Magdalino2002182Kaldellis2023636-134"
                - text: In 1071
                - link "Bari" [ref=f1e1145] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bari
                - text: ", the last remaining Byzantine settlement in Italy, was"
                - link "captured by the Normans" [ref=f1e1146] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Bari
                - text: ", while the Seljuks won a decisive victory at the"
                - link "Battle of Manzikert" [ref=f1e1147] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Manzikert
                - text: ", taking the emperor"
                - link "Romanos IV Diogenes" [ref=f1e1148] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romanos_IV_Diogenes
                - text: prisoner.
                - superscript [ref=f1e1149]:
                  - link "[133]" [ref=f1e1150] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008273Magdalino2002184–185,_189-135"
                - text: Romanos's capture and the political struggle that followed helped trigger a decade of civil conflict, during which Turkish forces overran much of Anatolia up to the
                - link "Sea of Marmara" [ref=f1e1152] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sea_of_Marmara
                - text: .
                - superscript [ref=f1e1153]:
                  - link "[134]" [ref=f1e1154] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023629–637Angold2009609–610-136"
            - region [ref=f1e1156]:
              - 'heading "1081–1204: Komnenos and Angelos dynasties" [level=3] [ref=f1e1158]'
              - note [ref=f1e1159]:
                - text: "Further information:"
                - link "Byzantine Empire under the Komnenos dynasty" [ref=f1e1160] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Komnenos_dynasty
                - text: and
                - link "Byzantine Empire under the Angelos dynasty" [ref=f1e1161] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Angelos_dynasty
              - paragraph [ref=f1e1162]:
                - text: One prominent general,
                - link "Alexios I" [ref=f1e1163] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alexios_I_Komnenos
                - text: ", usurped the throne in 1081. In contrast to the prior turmoil, the three reigns of Alexios ("
                - generic [ref=f1e1164]: r. 1081–1118
                - text: ), his son
                - link "John II" [ref=f1e1165] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_II_Komnenos
                - text: (
                - generic [ref=f1e1166]: r. 1118–1143
                - text: ), and his grandson
                - link "Manuel I" [ref=f1e1167] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Manuel_I_Komnenos
                - text: (
                - generic [ref=f1e1168]: r. 1143–1180
                - text: ) lasted almost a century and
                - link "restored the empire's regional authority" [ref=f1e1169] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Komnenian_restoration
                - text: for the final time.
                - superscript [ref=f1e1170]:
                  - link "[135]" [ref=f1e1171] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008273–274Angold2009611-137"
                - text: Alexios immediately faced the Normans under
                - link "Robert Guiscard" [ref=f1e1173] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Robert_Guiscard
                - text: and
                - link "repelled them through warfare and diplomacy" [ref=f1e1174] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Norman_wars#First_Norman_invasion_of_the_Balkans_(1081–1085)
                - text: .
                - superscript [ref=f1e1175]:
                  - link "[136]" [ref=f1e1176] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023639–642Holmes2008275Magdalino2002190-138"
                - text: He then targeted the Pechenegs and
                - link "decisively defeated them in 1091" [ref=f1e1178] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Levounion
                - text: with help from the
                - link "Cumans" [ref=f1e1179] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cumans
                - text: ; a separate Cuman incursion followed in 1094.
                - superscript [ref=f1e1180]:
                  - link "[137]" [ref=f1e1181] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023642–644Holmes2008275Angold2009611–612-139"
                - text: Finally, looking to recover Asia Minor from the Seljuks, he approached
                - link "Pope Urban II" [ref=f1e1183] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pope_Urban_II
                - text: for help c.
                - generic [ref=f1e1184]: "1095"
                - text: ". The scale and aims of western Christendom's response exceeded Byzantine expectations: the"
                - link "First Crusade" [ref=f1e1185] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First_Crusade
                - text: helped restore parts of western Anatolia to Byzantine control, although Alexios and its leaders soon fell out.
                - superscript [ref=f1e1186]:
                  - link "[138]" [ref=f1e1187] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008275Magdalino2002190Angold2009621–623-140"
                - text: The rest of his reign was spent
                - link "dealing with the Normans" [ref=f1e1189] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Treaty_of_Devol
                - text: and Seljuks, establishing a new, loyal aristocracy to ensure stability, and carrying out fiscal and ecclesiastical reforms.
                - superscript [ref=f1e1190]:
                  - link "[139]" [ref=f1e1191] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008274–275Angold2009612–613,_619–621,_623–625Kaldellis2023645–647,_659–663-141"
              - figure [ref=f1e1193]:
                - link [ref=f1e1194] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Comnenus_mosaics_Hagia_Sophia.jpg
                  - img "A mosaic depicting a haloed woman holding a baby, flanked by a man and woman, both crowned and haloed" [ref=f1e1195]
                - generic [ref=f1e1196]:
                  - text: A
                  - link "mosaic" [ref=f1e1197] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mosaic
                  - text: from the
                  - link "Hagia Sophia" [ref=f1e1198] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Hagia_Sophia
                  - text: of Constantinople (modern Istanbul), depicting
                  - link "Mary" [ref=f1e1199] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mary,_mother_of_Jesus
                  - text: and
                  - link "Jesus" [ref=f1e1200] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Jesus
                  - text: ", flanked by"
                  - link "John II Komnenos" [ref=f1e1201] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/John_II_Komnenos
                  - text: (left) and his wife
                  - link "Irene of Hungary" [ref=f1e1202] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Irene_of_Hungary
                  - text: (right), 12th century
              - paragraph [ref=f1e1203]:
                - text: Alexios' concentration of power in the hands of his
                - link "Komnenos dynasty" [ref=f1e1204] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Komnenos_dynasty
                - text: meant the most serious political threats came from within the imperial family—before his coronation, John II had to overcome
                - link "his mother Irene" [ref=f1e1205] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Irene_Doukaina
                - text: and
                - link "his sister Anna" [ref=f1e1206] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anna_Komnene
                - text: ", and the primary threat during his reign was"
                - link "his brother Isaac" [ref=f1e1207] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Isaac_Komnenos_(son_of_Alexios_I)
                - text: .
                - superscript [ref=f1e1208]:
                  - link "[140]" [ref=f1e1209] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008274Magdalino2009629–630-142"
                - text: John campaigned annually and extensively—he fought the Pechenegs in 1122, the
                - link "Hungarians in the late 1120s" [ref=f1e1211] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Hungarian_War_(1127–1129)
                - text: ", and the Seljuks throughout his reign, waging"
                - link "large campaigns in Syria" [ref=f1e1212] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Seljuk_wars#Byzantine_counter-attack:_1118–1180
                - text: in his final years—but he did not achieve large territorial gains.
                - superscript [ref=f1e1213]:
                  - link "[141]" [ref=f1e1214] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008275Magdalino2009631–633Kaldellis2023664–670-143"
                - text: In 1138, John raised the imperial standard over the Crusader
                - link "Principality of Antioch" [ref=f1e1216] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Principality_of_Antioch
                - text: to intimidate the city into allying with the Byzantines, but did not attack, fearing that it would provoke western Christendom to respond.
                - superscript [ref=f1e1217]:
                  - link "[142]" [ref=f1e1218] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023669Holmes2008275-144"
              - paragraph [ref=f1e1220]:
                - text: Manuel I used the considerable financial resources left by his father in pursuit of his ambitions, and also to secure the empire's position in an increasingly multilateral geopolitical landscape.
                - superscript [ref=f1e1221]:
                  - link "[143]" [ref=f1e1222] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023670,_676–677Magdalino2009644–646-145"
                - text: Through a combination of
                - link "diplomacy and subsidies" [ref=f1e1224] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_diplomacy
                - text: ", he cultivated a network of allies and client rulers around the empire: the Turks of the"
                - link "Sultanate of Rum" [ref=f1e1225] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sultanate_of_Rum
                - text: ", the"
                - link "Kingdom of Hungary" [ref=f1e1226] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kingdom_of_Hungary_(1000–1301)
                - text: ", the"
                - link "Cilician Armenians" [ref=f1e1227] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Armenian_Kingdom_of_Cilicia
                - text: ", Balkan princes, Italian and Dalmatian cities, and most importantly Antioch and the"
                - link "Crusader States" [ref=f1e1228] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crusader_States
                - text: ", marrying"
                - link "one of their princesses" [ref=f1e1229] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maria_of_Antioch
                - text: in 1161.
                - superscript [ref=f1e1230]:
                  - link "[144]" [ref=f1e1231] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023678,_683–688Holmes2008275–276-146"
                - text: Manuel managed the difficult passage of the
                - link "Second Crusade" [ref=f1e1233] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Second_Crusade
                - text: through Byzantine territories in 1147, but the campaign's failure was blamed on the Byzantines by western contemporaries.
                - superscript [ref=f1e1234]:
                  - link "[145]" [ref=f1e1235] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023679–681Magdalino2009637–638-147"
                - text: "He was less successful militarily: an invasion of"
                - link "Sicily" [ref=f1e1237] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kingdom_of_Sicily
                - text: was decisively defeated by
                - link "King William I" [ref=f1e1238] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/William_I_of_Sicily
                - text: in 1156, leading to tensions with
                - link "Frederick Barbarossa" [ref=f1e1239] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Frederick_Barbarossa
                - text: ", the Holy Roman Emperor;"
                - superscript [ref=f1e1240]:
                  - link "[146]" [ref=f1e1241] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023682–683Magdalino2002194Magdalino2009638–641-148"
                - text: two decades later, an invasion of Anatolia was defeated at the
                - link "Battle of Myriokephalon" [ref=f1e1243] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Myriokephalon
                - text: .
                - superscript [ref=f1e1244]:
                  - link "[147]" [ref=f1e1245] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMagdalino2009643–644Kaldellis2023692–693-149"
              - figure [ref=f1e1247]:
                - link [ref=f1e1248] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Eugène_Delacroix_-_Prise_de_Constantinople_par_les_croisés_(12_avril_1204).jpg
                  - img "A painting of an army marching into a city gate with much smoke in the background" [ref=f1e1249]
                - generic [ref=f1e1250]:
                  - link "The Entry of the Crusaders into Constantinople" [ref=f1e1251] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Entry_of_the_Crusaders_in_Constantinople
                  - text: ", by"
                  - link "Eugène Delacroix" [ref=f1e1252] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Eugène_Delacroix
                  - text: (1840)
              - paragraph [ref=f1e1253]:
                - text: Manuel's death exposed the fragility of the political system and the empire soon came under intense pressure.
                - superscript [ref=f1e1254]:
                  - link "[148]" [ref=f1e1255] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023695-150"
                - text: His son
                - link "Alexios II" [ref=f1e1257] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alexios_II_Komnenos
                - text: was too young to rule, and his troubled regency was overthrown by his uncle
                - link "Andronikos I Komnenos" [ref=f1e1258] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andronikos_I_Komnenos
                - text: ; he was replaced by
                - link "Isaac II" [ref=f1e1259] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Isaac_II_Angelos
                - text: in 1185.
                - superscript [ref=f1e1260]:
                  - link "[149]" [ref=f1e1261] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMagdalino2002194Holmes2008276-151"
                - text: "The empire lost ground on several frontiers as ambitious rulers seized their chance: Hungary and the Turks captured Byzantine territories,"
                - link "an exiled Komnenian prince" [ref=f1e1263] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Isaac_Komnenos_of_Cyprus
                - text: seized Cyprus; and most injuriously,
                - link "a revolt in 1185" [ref=f1e1264] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Uprising_of_Asen_and_Peter
                - text: caused the foundation of a
                - link "resurrected Bulgarian state" [ref=f1e1265] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Second_Bulgarian_Empire
                - text: .
                - superscript [ref=f1e1266]:
                  - link "[150]" [ref=f1e1267] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008276Magdalino2002194–195Magdalino2009655-152"
                - text: Relations with the West deteriorated further after Constantinople sought an understanding with
                - link "Saladin" [ref=f1e1269] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Saladin
                - text: and obstructed the overland army of
                - link "Frederick Barbarossa" [ref=f1e1270] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Frederick_Barbarossa
                - text: during the
                - link "Third Crusade" [ref=f1e1271] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Third_Crusade
                - text: .
                - superscript [ref=f1e1272]:
                  - link "[151]" [ref=f1e1273] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMagdalino2002195–196Magdalino2009648–651Kaldellis2023706–710-153"
                - text: In 1195, Isaac II was deposed by his brother
                - link "Alexios III" [ref=f1e1275] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alexios_III_Angelos
                - text: ; this dynastic quarrel helped make the Fourth Crusade's intervention in Constantinople possible.
                - superscript [ref=f1e1276]:
                  - link "[152]" [ref=f1e1277] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHolmes2008276-154"
              - paragraph [ref=f1e1279]:
                - text: The
                - link "Fourth Crusade" [ref=f1e1280] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fourth_Crusade
                - text: was originally intended to target
                - link "Egypt" [ref=f1e1281] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ayyubid_Sultanate
                - text: ", but amid strategic difficulties, Isaac II's son"
                - link "Alexios Angelos" [ref=f1e1282] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alexios_IV_Angelos
                - text: convinced the crusaders to restore his father to the throne in exchange for a huge tribute.
                - superscript [ref=f1e1283]:
                  - link "[153]" [ref=f1e1284] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023718–720Magdalino2009651–652-155"
                - text: They
                - link "attacked Constantinople in 1203" [ref=f1e1286] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(1203)
                - text: ", reinstating Isaac II and his son to the throne. The new rulers swiftly grew unpopular and were deposed by"
                - link "Alexios V" [ref=f1e1287] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alexios_V_Doukas
                - text: ", an event used by the crusaders as a pretext to"
                - link "sack the city in April 1204" [ref=f1e1288] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sack_of_Constantinople
                - text: ", ransacking the accumulated wealth of Constantinople."
                - superscript [ref=f1e1289]:
                  - link "[154]" [ref=f1e1290] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023720–724Magdalino2009652–653-156"
            - region [ref=f1e1292]:
              - 'heading "1204–1453: Palaiologos dynasty" [level=3] [ref=f1e1294]'
              - note [ref=f1e1295]:
                - text: "Further information:"
                - link "Byzantine Empire under the Palaiologos dynasty" [ref=f1e1296] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Palaiologos_dynasty
              - figure "The partition of the empire following the Fourth Crusade, c. 1204[155]" [ref=f1e1297]:
                - link [ref=f1e1298] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:LatinEmpire2.png
                  - img "A map showing the competing states after the Fourth Crusade." [ref=f1e1299]
                - generic [ref=f1e1300]:
                  - text: The partition of the empire following the
                  - link "Fourth Crusade" [ref=f1e1301] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Fourth_Crusade
                  - text: ", c."
                  - generic [ref=f1e1302]: "1204"
                  - superscript [ref=f1e1303]:
                    - link "[155]" [ref=f1e1304] [cursor=pointer]:
                      - /url: "#cite_note-FOOTNOTELaiou2008280Kaldellis2023733–734Reinert2002250–253Angold2009b731-157"
              - paragraph [ref=f1e1306]:
                - text: Byzantine territories fragmented into competing political entities. The crusaders crowned
                - link "Baldwin I" [ref=f1e1307] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Baldwin_I,_Latin_Emperor
                - text: as the ruler of a new
                - link "Latin Empire" [ref=f1e1308] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Latin_Empire
                - text: in Constantinople; it soon suffered
                - link "a crushing defeat" [ref=f1e1309] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Adrianople_(1205)
                - text: "against the Bulgarians in 1205. It also failed to expand west or east, where three successor states had formed: the"
                - link "Empire of Nicaea" [ref=f1e1310] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Empire_of_Nicaea
                - text: and the
                - link "Empire of Trebizond" [ref=f1e1311] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Empire_of_Trebizond
                - text: in Asia Minor, and the
                - link "Despotate of Epirus" [ref=f1e1312] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Despotate_of_Epirus
                - text: on the Adriatic. The Venetians acquired many ports and islands, and the
                - link "Principality of Achaea" [ref=f1e1313] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Principality_of_Achaea
                - text: emerged in southern Greece.
                - superscript [ref=f1e1314]:
                  - link "[155]" [ref=f1e1315] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2008280Kaldellis2023733–734Reinert2002250–253Angold2009b731-157"
                - text: Trebizond
                - link "lost" [ref=f1e1317] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Sinope
                - text: the key port of
                - link "Sinope" [ref=f1e1318] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sinop,_Turkey
                - text: in 1214 and thereafter played little role away from the southeastern Black Sea.
                - superscript [ref=f1e1319]:
                  - link "[156]" [ref=f1e1320] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023755–758Angold2009b737-158"
                - text: For a time, Epirus appeared well placed to reclaim Constantinople from the Latins, and its ruler
                - link "Theodore Doukas" [ref=f1e1322] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodore_Komnenos_Doukas
                - text: crowned himself emperor, but he suffered a critical defeat at the
                - link "Battle of Klokotnitsa" [ref=f1e1323] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Klokotnitsa
                - text: in 1230, and Epirote power waned.
                - superscript [ref=f1e1324]:
                  - link "[157]" [ref=f1e1325] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2008283Reinert2002254Angold2009b737–738Kaldellis2023766–770-159"
              - paragraph [ref=f1e1327]:
                - text: Nicaea, ruled by the
                - link "Laskarid dynasty" [ref=f1e1328] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Laskaris
                - text: and drawing on both Byzantine refugees and local populations, blocked the Latins and the Seljuks of Rum from expanding east and west respectively.
                - superscript [ref=f1e1329]:
                  - link "[158]" [ref=f1e1330] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002253Kaldellis2023760–762-160"
                - link "John III" [ref=f1e1332] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_III_Doukas_Vatatzes
                - text: (
                - generic [ref=f1e1333]: r. 1221–1254
                - text: ) strengthened Nicaea militarily, economically, and diplomatically.
                - superscript [ref=f1e1334]:
                  - link "[159]" [ref=f1e1335] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023771Laiou2008282–283-161"
                - text: He discouraged imports and promoted local production,
                - superscript [ref=f1e1337]:
                  - link "[160]" [ref=f1e1338] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAngold2009b740Laiou2008282–283Kaldellis2023772-162"
                - text: and he made many diplomatic treaties, especially after
                - link "Mongol" [ref=f1e1340] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mongol_Empire
                - text: armies
                - link "ravaged Bulgaria" [ref=f1e1341] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mongol_invasion_of_Bulgaria_and_Serbia
                - text: and
                - link "defeated Rum" [ref=f1e1342] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Köse_Dağ
                - text: between 1237 and 1243. This chaos was an opportunity for John, and he fought many successful campaigns against the states disrupted by the
                - link "Mongol invasions" [ref=f1e1343] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mongol_invasions
                - text: .
                - superscript [ref=f1e1344]:
                  - link "[161]" [ref=f1e1345] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023774–781Reinert2002254-163"
                - text: Soon after his death,
                - link "his grandson" [ref=f1e1347] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_IV_Laskaris
                - text: was usurped by
                - link "Michael VIII" [ref=f1e1348] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_VIII_Palaiologos
                - text: ", founder of the"
                - link "Palaiologos dynasty" [ref=f1e1349] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Palaiologos
                - text: ", who"
                - link "recaptured Constantinople" [ref=f1e1350] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Reconquest_of_Constantinople
                - text: in 1261.
                - superscript [ref=f1e1351]:
                  - link "[162]" [ref=f1e1352] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2008283Reinert2002254-164"
              - paragraph [ref=f1e1354]:
                - text: Michael desired to restore the empire's glory through a rebuilding programme in Constantinople, clever diplomatic alliances, and expansionist wars in Europe.
                - superscript [ref=f1e1355]:
                  - link "[163]" [ref=f1e1356] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002256–257Laiou2008286-165"
                - text: He staved off the threatening
                - link "Charles I of Anjou" [ref=f1e1358] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charles_I_of_Anjou
                - text: first by recognising papal primacy and certain Catholic doctrines at the 1274
                - link "Second Council of Lyon" [ref=f1e1359] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Second_Council_of_Lyon
                - text: ", and then by aiding the"
                - link "Sicilian Vespers" [ref=f1e1360] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sicilian_Vespers
                - text: against Charles in 1282.
                - superscript [ref=f1e1361]:
                  - link "[164]" [ref=f1e1362] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002257–258Laiou2009803–804-166"
                - text: However, his religious concessions were despised by most of the populace, and were repudiated by his successor
                - link "Andronikos II" [ref=f1e1364] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andronikos_II_Palaiologos
                - text: (
                - generic [ref=f1e1365]: r. 1282–1328
                - text: ).
                - superscript [ref=f1e1366]:
                  - link "[165]" [ref=f1e1367] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002258Laiou2008287-167"
                - text: He and his grandson
                - link "Andronikos III" [ref=f1e1369] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andronikos_III_Palaiologos
                - text: (
                - generic [ref=f1e1370]: r. 1328–1341
                - text: ) led several campaigns to restore imperial influence, succeeding in Epirus and Thessaly. Their policies also weakened the state, including the dismissal of the fleet in 1285, the hiring of the mercenary
                - link "Catalan Company" [ref=f1e1371] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Catalan_Company
                - text: ", which turned on the Byzantines in the 1300s, and their civil war between 1320 and 1328."
                - superscript [ref=f1e1372]:
                  - link "[166]" [ref=f1e1373] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2008287–288Reinert2002260–263Kaldellis2023847-168"
                - text: A disastrous civil war between 1341 and 1354 caused long-term economic difficulties, while the
                - link "Ottoman Turks" [ref=f1e1375] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ottoman_Turks
                - text: gradually expanded.
                - superscript [ref=f1e1376]:
                  - link "[167]" [ref=f1e1377] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2008289–290Reinert2002265–268-169"
              - figure [ref=f1e1379]:
                - link [ref=f1e1380] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Le_siège_de_Constantinople_(1453)_by_Jean_Le_Tavernier_after_1455.jpg
                  - img "A painting of a siege of a city" [ref=f1e1381]
                - generic [ref=f1e1382]:
                  - text: The
                  - link "siege of Constantinople" [ref=f1e1383] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Fall_of_Constantinople
                  - text: in 1453, depicted in a 15th-century French miniature
              - paragraph [ref=f1e1384]:
                - text: The diminished Byzantine state survived for another century through diplomacy and favourable external developments.
                - superscript [ref=f1e1385]:
                  - link "[168]" [ref=f1e1386] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2008291-170"
                - text: The Ottomans gradually subjugated Anatolia and simultaneously expanded into Europe from 1354, taking
                - link "Philippopolis" [ref=f1e1388] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Philippopolis_(Thrace)
                - text: in 1363,
                - link "Adrianopolis" [ref=f1e1389] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Adrianopolis
                - text: in 1369, and
                - link "Thessalonica" [ref=f1e1390] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thessalonica
                - text: in 1387.
                - superscript [ref=f1e1391]:
                  - link "[169]" [ref=f1e1392] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2008291Reinert2002268–269-171"
                - text: Dynastic struggles increasingly depended on Venetian, Genoese, and Ottoman backing.
                - superscript [ref=f1e1394]:
                  - link "[170]" [ref=f1e1395] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELaiou2009829-172"
                - text: After
                - link "Manuel II" [ref=f1e1397] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Manuel_II_Palaiologos
                - text: (
                - generic [ref=f1e1398]: r. 1391–1425
                - text: ) refused to pay homage to Sultan
                - link "Bayezid I" [ref=f1e1399] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bayezid_I
                - text: in 1394,
                - link "Constantinople was besieged" [ref=f1e1400] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(1394–1402)
                - text: until the rampaging warlord
                - link "Timur" [ref=f1e1401] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Timur
                - text: decisively
                - link "defeated Bayezid" [ref=f1e1402] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Ankara
                - text: in 1402, with the city perilously close to surrender.
                - superscript [ref=f1e1403]:
                  - link "[171]" [ref=f1e1404] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002273–274Laiou2009831–832Kaldellis2023887–889-173"
              - paragraph [ref=f1e1406]:
                - text: After Ankara, Manuel II gained nearly two decades of relative peace as
                - link "Ottoman succession struggles" [ref=f1e1407] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ottoman_Interregnum
                - text: and later Anatolian campaigns occupied the sultans.
                - superscript [ref=f1e1408]:
                  - link "[172]" [ref=f1e1409] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002274–276Laiou2008292Kaldellis2023892–894-174"
                - text: In 1421, his unsuccessful backing of the claimant
                - link "Mustafa Çelebi" [ref=f1e1411] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mustafa_Çelebi
                - text: led to a
                - link "renewed Ottoman assault" [ref=f1e1412] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siege_of_Constantinople_(1422)
                - text: .
                - superscript [ref=f1e1413]:
                  - link "[173]" [ref=f1e1414] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002276-175"
                - text: Although
                - link "John VIII" [ref=f1e1416] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_VIII_Palaiologos
                - text: (
                - generic [ref=f1e1417]: r. 1425–1448
                - text: ) reconciled with the Catholic West at the
                - link "Council of Florence" [ref=f1e1418] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Council_of_Florence
                - text: ", his empire steadily diminished."
                - superscript [ref=f1e1419]:
                  - link "[174]" [ref=f1e1420] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002278–279Kaldellis2023903–908-176"
                - text: In 1452, Sultan
                - link "Mehmed II" [ref=f1e1422] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mehmed_II
                - text: resolved to capture Constantinople, and laid siege early the following year. On 29 May 1453,
                - link "the city was captured" [ref=f1e1423] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fall_of_Constantinople
                - text: ", the last emperor,"
                - link "Constantine XI" [ref=f1e1424] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_XI_Palaiologos
                - text: ", died in battle, and the Byzantine Empire ended."
                - superscript [ref=f1e1425]:
                  - link "[175]" [ref=f1e1426] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEReinert2002280–283Laiou2008292–293Kaldellis2023910–914-177"
          - region [ref=f1e1428]:
            - heading "Structures of the state" [level=2] [ref=f1e1430]
            - generic [ref=f1e1432]:
              - generic [ref=f1e1434]:
                - link [ref=f1e1437] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Byzantine_Empire_Themata-750-en.svg
                  - img "A map centred on Turkey. From west to east and north to south with the corresponding colours in brackets; are the themes of Opsikion (light purple), Thracesians (light grey), Cibyrrhaeots (light green), Optimatoi (green), Anatolic (brown), Bucellarians (orange) and Armeniacs (purple). On the map are marked the major rivers; the Aegean, Black and Mediterranean Seas; the cities of Ephesos, Constantinople, Ancyra, Tarsus, Adana, Antioch and Edessa; and the islands of Samos, Crete and Cyprus." [ref=f1e1438]
                - generic [ref=f1e1439]:
                  - text: The themes of Asia Minor, c.
                  - generic [ref=f1e1440]: "750"
              - generic [ref=f1e1442]:
                - link [ref=f1e1445] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Byzantine_Empire_Themata-950-en.svg
                  - img "A map centred on Turkey. From west to east and north to south with the corresponding colours in brackets; are the themes of Opsikion (light purple), Samos (dark grey), Thracesians (light grey), Cibyrrhaeots (light green), Optimatoi (dark grey), Anatolic and Seleucia (brown), Bucellarians (orange), Paphlagonia (navy blue), Cappadocia (green), Charsianon (pink), Armeniacs (purple), Lycandus and Mesopotamia (brown), Sebastea (blue), Koloneia (dark green) and Chaldia (light blue). On the map are marked the major rivers; the Aegean, Black and Mediterranean Seas; the cities of Ephesos, Constantinople, Ancyra, Tarsus, Adana, Antioch and Edessa; and the islands of Crete and Cyprus." [ref=f1e1446]
                - generic [ref=f1e1447]:
                  - text: The themes of Asia Minor, c.
                  - generic [ref=f1e1448]: "950"
            - region [ref=f1e1449]:
              - heading "Governance" [level=3] [ref=f1e1451]
              - note [ref=f1e1452]:
                - text: "See also:"
                - link "Subdivisions of the Byzantine Empire" [ref=f1e1453] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Subdivisions_of_the_Byzantine_Empire
              - paragraph [ref=f1e1454]:
                - text: Diocletian and Constantine's 4th-century reforms reorganised the empire's provinces into overarching
                - link "Dioceses" [ref=f1e1455] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_diocese
                - text: and then into
                - link "Praetorian prefectures" [ref=f1e1456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Praetorian_prefecture
                - text: ", separating the army from the civil administration."
                - superscript [ref=f1e1457]:
                  - link "[176]" [ref=f1e1458] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2005306–308Treadgold1997b82–83-178"
                - text: The central government, led by the
                - link "emperor" [ref=f1e1460] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_emperor
                - text: from the time of the earlier
                - link "pax romana" [ref=f1e1461] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pax_romana
                - text: and into the late
                - link "Palaiologan era" [ref=f1e1462] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Palaiologos_dynasty
                - text: ", typically focused on the military, foreign relations, administering the law, and collecting taxes."
                - superscript [ref=f1e1463]:
                  - link "[177]" [ref=f1e1464] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning199298Stewart202210–11-179"
                - text: A person usually ascended into the position of emperor
                - link "after a ceremony" [ref=f1e1466] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coronation_of_the_Byzantine_emperor
                - text: . The
                - link "senate" [ref=f1e1467] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_senate
                - text: evolved into a ceremonial body within the imperial court.
                - superscript [ref=f1e1468]:
                  - link "[178]" [ref=f1e1469] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis202335Howard-Johnston20248Browning199298-180"
              - paragraph [ref=f1e1471]:
                - text: Cities had been a collection of self-governing communities with central government and church representatives from the 5th century.
                - superscript [ref=f1e1472]:
                  - link "[179]" [ref=f1e1473] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning199298Kaldellis2023185-181"
                - text: However, constant warfare significantly altered this, as regular raids and ongoing conflict led to power centralising due to the empire's fight for survival.
                - superscript [ref=f1e1475]:
                  - link "[180]" [ref=f1e1476] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning199298Howard-Johnston202467Kaldellis2023397,_407–409-182"
                - text: After the 7th century, the prefectures were abandoned, and in the 9th century, the provinces were divided into administrative units called
                - link "themes (or themata)" [ref=f1e1478] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theme_(Byzantine_district)
                - text: ", governed solely by a military commander ("
                - link "strategos" [ref=f1e1480] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Strategos
                - text: ).
                - superscript [ref=f1e1481]:
                  - link "[181]" [ref=f1e1482] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth2005303Treadgold1997b430–431Kaldellis2023418,_421-183"
            - region [ref=f1e1484]:
              - heading "Law" [level=3] [ref=f1e1486]
              - note [ref=f1e1487]:
                - text: "Main article:"
                - link "Byzantine law" [ref=f1e1488] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_law
              - paragraph [ref=f1e1489]:
                - text: Theodosius II (
                - generic [ref=f1e1490]: r. 408–450
                - text: ) formalised
                - link "Roman law" [ref=f1e1491] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_law
                - text: by appointing five jurists as principal authorities and compiling legislation issued since Constantine's reign into the
                - link "Codex Theodosianus" [ref=f1e1492] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Codex_Theodosianus
                - text: .
                - superscript [ref=f1e1493]:
                  - link "[182]" [ref=f1e1494] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023168Stein199914,_16,_28Kaiser2015120-184"
                - text: This process culminated in the
                - link "Corpus Juris Civilis" [ref=f1e1497] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Corpus_Juris_Civilis
                - text: under Justinian I (
                - generic [ref=f1e1498]: r. 527–565
                - text: ), who commissioned a complete standardisation of imperial decrees since Hadrian's time and resolved conflicting legal opinions of the jurists.
                - superscript [ref=f1e1499]:
                  - link "[183]" [ref=f1e1500] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGregory2010135Stein199933–35Dingledy20192–14Kaiser2015123–126-185"
                - text: The result became the definitive legal authority. This body of law covered
                - link "civil matters" [ref=f1e1502] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Civil_law_(legal_system)
                - text: and also
                - link "public law" [ref=f1e1503] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Public_law
                - text: ", including imperial power and administrative organisation."
                - superscript [ref=f1e1504]:
                  - link "[184]" [ref=f1e1505] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStein19998MerrymanPérez-Perdomo200721-186"
                - text: After 534, Justinian issued the
                - link "Novellae (New Laws)" [ref=f1e1507] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Novellae_Constitutiones
                - text: in Greek, which marked a transition from Roman to Byzantine law. Legal historian Bernard Stolte distinguishes Roman law as this because Western Europe inherited law through the Latin texts of the Corpus Juris Civilis only.
                - superscript [ref=f1e1508]:
                  - link "[185]" [ref=f1e1509] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStolte2015356,_370Stolte2018231–232-187"
              - paragraph [ref=f1e1511]:
                - text: Zachary Chitwood argues that the Corpus Juris Civilis was largely inaccessible in Latin, particularly in the provinces.
                - superscript [ref=f1e1512]:
                  - link "[186]" [ref=f1e1513] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEChitwood201723-188"
                - text: Following the 7th-century Arab conquests, people began questioning the development and application of law, leading to stronger ties between law and Christianity.
                - superscript [ref=f1e1515]:
                  - link "[187]" [ref=f1e1516] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEChitwood2017185-189"
                - text: This context influenced Leo III (
                - generic [ref=f1e1518]: r. 717–741
                - text: ) to develop the
                - link "Ekloge ton nomon" [ref=f1e1520] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ekloge_ton_nomon
                - text: ", which placed an emphasis on humanity."
                - superscript [ref=f1e1521]:
                  - link "[188]" [ref=f1e1522] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEChitwood2017185Nicol19886523–24-190"
                - text: The Ekloge inspired practical legal texts like the Farmers' Law, Seamen's Law, and Soldiers' Law, which Chitwood suggests were used daily in the provinces as companions to the Corpus Juris Civilis.
                - superscript [ref=f1e1524]:
                  - link "[189]" [ref=f1e1525] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEChitwood201723,_132,_364-191"
                - text: During the Macedonian dynasty, efforts to reform law began with the publication of the Procheiron and the Eisagoge, which aimed to define the emperor's power under prevailing laws, and to replace the Ekloge due to its association with
                - link "iconoclasm" [ref=f1e1527] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iconoclasm
                - text: .
                - superscript [ref=f1e1528]:
                  - link "[190]" [ref=f1e1529] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning199297Kaldellis2023529Chitwood201725–32,_44-192"
                - text: Leo VI (
                - generic [ref=f1e1531]: r. 886–912
                - text: ) completed a
                - link "complete codification" [ref=f1e1532] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Codification_(law)
                - text: of Roman law in Greek through the
                - link "Basilika" [ref=f1e1534] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basilika
                - text: ", a work of 60 books which became the foundation of Byzantine law."
                - superscript [ref=f1e1535]:
                  - link "[191]" [ref=f1e1536] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning199297–98Chitwood201732–35Kaldellis2023529-193"
                - text: In 1345, Constantine Harmenopoulos compiled the
                - link "Hexabiblos" [ref=f1e1539] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_Harmenopoulos
                - text: ", a six-volume law book derived from various Byzantine legal sources."
                - superscript [ref=f1e1540]:
                  - link "[192]" [ref=f1e1541] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStein199935-194"
            - region [ref=f1e1543]:
              - heading "Christianity and the Church" [level=3] [ref=f1e1545]
              - note [ref=f1e1546]:
                - text: "Main article:"
                - link "Christianity as the Roman state religion" [ref=f1e1547] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christianity_as_the_Roman_state_religion
              - note [ref=f1e1548]:
                - text: "See also:"
                - link "History of Christianity" [ref=f1e1549] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/History_of_Christianity
                - text: ","
                - link "History of the Eastern Orthodox Church § Byzantine period" [ref=f1e1550] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/History_of_the_Eastern_Orthodox_Church#Byzantine_period
                - text: ", and"
                - link "History of the Jews in the Byzantine Empire" [ref=f1e1551] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/History_of_the_Jews_in_the_Byzantine_Empire
              - figure [ref=f1e1552]:
                - link [ref=f1e1553] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Aya_Sophia_(7144824757).jpg
                - generic [ref=f1e1555]:
                  - text: The
                  - link "Hagia Sophia" [ref=f1e1556] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Hagia_Sophia
                  - text: in
                  - link "Constantinople" [ref=f1e1557] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Constantinople
                  - text: (now
                  - link "Istanbul" [ref=f1e1558] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Istanbul
                  - text: ) was built by the Eastern Roman emperor
                  - link "Justinian the Great" [ref=f1e1559] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Justinian_the_Great
                  - text: in 532–537.
                  - superscript [ref=f1e1560]:
                    - link "[193]" [ref=f1e1561] [cursor=pointer]:
                      - /url: "#cite_note-195"
              - paragraph [ref=f1e1563]:
                - text: Christianity, bolstered by
                - link "Constantine" [ref=f1e1564] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Constantine_the_Great
                - text: "'s support, began shaping all aspects of life in the early Byzantine Empire."
                - superscript [ref=f1e1565]:
                  - link "[194]" [ref=f1e1566] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPapaconstantinou2016xxxiiCameron201631Cameron2006b544–551Drake2007418,_422Greatrex2008236-196"
                - text: Despite the transition, the historian
                - link "Anthony Kaldellis" [ref=f1e1568] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthony_Kaldellis
                - text: views Christianity as "bringing no economic, social, or political changes to the state other than being more deeply integrated into it".
                - superscript [ref=f1e1569]:
                  - link "[195]" [ref=f1e1570] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023141,_186,_342-197"
                - text: When the Roman state in the West collapsed politically, cultural differences began to divide the Christian churches of the East and West.
                - superscript [ref=f1e1572]:
                  - link "[196]" [ref=f1e1573] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown19768Löhr20079-198"
                - text: Internal disputes within the Eastern churches led to the migration of monastic communities to Rome, exacerbating tensions between Rome and Constantinople.
                - superscript [ref=f1e1575]:
                  - link "[197]" [ref=f1e1576] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2023390Cameron2017A_United_Church,_chapter_1-199"
                - text: These disputes,
                - superscript [ref=f1e1578]:
                  - link "[c]" [ref=f1e1579] [cursor=pointer]:
                    - /url: "#cite_note-202"
                - text: "particularly in Egypt and the eastern Mediterranean, eventually split the church into three branches:"
                - link "Chalcedonian" [ref=f1e1581] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chalcedonian_Christianity
                - text: ", Monophysite (Coptic), and"
                - link "Nestorian" [ref=f1e1582] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Church_of_the_East
                - text: .
                - superscript [ref=f1e1583]:
                  - link "[200]" [ref=f1e1584] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAdams2021366Micheau2006373,_375-203"
                - text: The Chalcedonian group maintained dominance within the empire's territories, while the Monophysite and Nestorian branches largely fell under Muslim rule in the 7th century.
                - superscript [ref=f1e1586]:
                  - link "[201]" [ref=f1e1587] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMicheau2006373–374,_376-204"
              - paragraph [ref=f1e1589]:
                - text: Eastern patriarchs frequently sought the Papacy's mediation in doctrinal and practical matters, but the pope's authority was not universally acknowledged, even in nearby regions like Northern Italy.
                - superscript [ref=f1e1590]:
                  - link "[202]" [ref=f1e1591] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTENicholson196054,_60CasidayNorris2007a3-205"
                - text: By 600, the Slavic settlement of the Balkans disrupted communication between Rome and Constantinople, further widening the divide.
                - superscript [ref=f1e1593]:
                  - link "[203]" [ref=f1e1594] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELouth200847Kolbaba2008214–215-206"
                - text: The Arab and Lombard invasions, and the increased
                - link "Frankish" [ref=f1e1596] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Franks
                - text: presence, deepened this estrangement and intensified disputes over jurisdiction and authority between the two spiritual centres.
                - superscript [ref=f1e1597]:
                  - link "[204]" [ref=f1e1598] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKolbaba2008213–215,_218–221-207"
                - text: Differences in ritual and theology, such as the use of
                - link "unleavened bread" [ref=f1e1600] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Azymite
                - text: and the
                - link "Filioque clause" [ref=f1e1601] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Filioque
                - text: ", as well as divergences in ecclesiology—"
                - link "plenitudo potestatis" [ref=f1e1602] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Plenitudo_potestatis
                - text: versus the authority of
                - link "Ecumenical Councils" [ref=f1e1603] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ecumenical_Councils
                - text: —and issues of mutual respect, contributed to the separation of Western Christianity from Eastern Christianity.
                - superscript [ref=f1e1604]:
                  - link "[205]" [ref=f1e1605] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMeyendorff197995,_97_101Kolbaba2008223-208"
                - text: This separation began by 597 and culminated in 1054 during the
                - link "East–West Schism" [ref=f1e1607] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/East–West_Schism
                - text: .
                - superscript [ref=f1e1608]:
                  - link "[206]" [ref=f1e1609] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown200813Kolbaba2008223-209"
          - region [ref=f1e1611]:
            - heading "Warfare" [level=2] [ref=f1e1613]
            - region [ref=f1e1614]:
              - heading "Military evolution" [level=3] [ref=f1e1616]
              - note [ref=f1e1617]:
                - text: "Main articles:"
                - link "Eastern Roman army" [ref=f1e1618] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eastern_Roman_army
                - text: ","
                - link "Byzantine army" [ref=f1e1619] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_army
                - text: ", and"
                - link "Byzantine navy" [ref=f1e1620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_navy
              - figure "Shield insignia of regiments under the command of the Magister Militum Praesentalis II of the East Roman army c. 395 AD. Page from the Notitia Dignitatum" [ref=f1e1621]:
                - link [ref=f1e1622] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Bodl_Canon.Misc.378_roll159B_frame28.jpg
              - paragraph [ref=f1e1625]:
                - text: In the late 6th century, following Justinian I's wars, seven mobile
                - link "field armies" [ref=f1e1626] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Field_armies
                - text: called
                - link "comitatenses" [ref=f1e1628] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Comitatenses
                - text: ", numbering around 150,000 troops, were deployed around the empire; they remained the finest armies in Europe."
                - superscript [ref=f1e1629]:
                  - link "[207]" [ref=f1e1630] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold199563–64,_206Haldon199967-210"
                - text: They were aided by twenty-five frontier garrisons of approximately 195,000 lower-quality
                - link "limitanei" [ref=f1e1633] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Limitanei
                - text: troops.
                - superscript [ref=f1e1634]:
                  - link "[208]" [ref=f1e1635] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold199563,_204Haldon199967Decker201371-211"
                - text: Additional troops included
                - link "subsidised allied forces" [ref=f1e1637] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Foederati
                - text: and
                - link "imperial guard units" [ref=f1e1638] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Imperial_guard
                - text: like the
                - link "Scholae Palatinae" [ref=f1e1640] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Scholae_Palatinae
                - text: .
                - superscript [ref=f1e1641]:
                  - link "[209]" [ref=f1e1642] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon199968-212"
                - text: "Naval forces were limited:"
                - link "flotillas" [ref=f1e1644] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Flotilla
                - text: were based at key locations, while 30,000 oarsmen were assembled to row 500, mostly requisitioned,
                - link "transports" [ref=f1e1645] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maritime_transport
                - text: to support the
                - link "Vandalic War" [ref=f1e1646] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vandalic_War
                - text: in Africa in 533.
                - superscript [ref=f1e1647]:
                  - link "[210]" [ref=f1e1648] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold199563–64Haldon199968–69Haldon2008b554-213"
              - paragraph [ref=f1e1650]:
                - text: The losses suffered in the 7th-century
                - link "Arab conquests" [ref=f1e1651] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Early_Muslim_conquests
                - text: led to fundamental changes.
                - superscript [ref=f1e1652]:
                  - link "[211]" [ref=f1e1653] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon199974Decker201374-214"
                - text: The field armies were withdrawn into the core Anatolian territories and assigned to settle in specific districts, which became known as themata and eventually replaced the
                - link "old provinces" [ref=f1e1655] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_province#Late_imperial_period
                - text: .
                - superscript [ref=f1e1656]:
                  - link "[212]" [ref=f1e1657] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold199523Haldon2008b554–555-215"
                - text: The thematic armies, supported by the proceeds of their districts, came to resemble a provincial
                - link "militia" [ref=f1e1659] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Militia
                - text: with a small professional core, aided by foreign mercenaries and imperial regiments at Constantinople.
                - superscript [ref=f1e1660]:
                  - link "[213]" [ref=f1e1661] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b555–556Kaldellis2021a463-216"
                - text: To defend against
                - link "its new Muslim enemy" [ref=f1e1663] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Early_Caliphate_navy
                - text: ", the navy was similarly reorganised into several provincialised fleets."
                - superscript [ref=f1e1664]:
                  - link "[214]" [ref=f1e1665] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon199974Haldon2008b559-217"
                - text: It became the dominant power in the eastern Mediterranean, with
                - link "dromons" [ref=f1e1667] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dromon
                - text: equipped with
                - link "Greek fire" [ref=f1e1668] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_fire
                - text: proving crucial on several occasions.
                - superscript [ref=f1e1669]:
                  - link "[215]" [ref=f1e1670] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEDecker2013207–208,_222–224Kaldellis2021a463Howard-Johnston2008947-218"
              - paragraph [ref=f1e1672]:
                - text: As the 8th-century empire stabilised, the thematic militias proved rebellious and only suitable for defensive operations.
                - superscript [ref=f1e1673]:
                  - link "[216]" [ref=f1e1674] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis2021a463Treadgold199525,_209Decker201377–78-219"
                - text: The professional
                - link "tagmata" [ref=f1e1677] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tagma_(military)
                - text: regiments, first introduced in the mid-700s and consisting of native Byzantine units alongside foreign forces such as the
                - link "Varangian Guard" [ref=f1e1678] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Varangian_Guard
                - text: ", had completely replaced them by the 11th century."
                - superscript [ref=f1e1679]:
                  - link "[217]" [ref=f1e1680] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon199992Decker201378–82-220"
                - text: The mobile tagmata, suitable for offensive warfare, evolved new tactical and strategic structures;
                - superscript [ref=f1e1682]:
                  - link "[218]" [ref=f1e1683] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b556-221"
                - text: the late 10th-century army, perhaps the highest-quality force the empire produced, numbered approximately 140,000, up from below 100,000 in the late 700s.
                - superscript [ref=f1e1685]:
                  - link "[219]" [ref=f1e1686] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold199567Kaldellis2021a463Kaldellis2023562-222"
                - text: However, its defensive capacities were neglected, especially during the 11th-century civil wars, leading to the loss of Anatolia to the Seljuks.
                - superscript [ref=f1e1688]:
                  - link "[220]" [ref=f1e1689] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b557Treadgold1995214–218-223"
                - text: The navy had also been reduced, as the empire increasingly relied on potentially hostile powers such as
                - link "Venice" [ref=f1e1691] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Republic_of_Venice
                - text: .
                - superscript [ref=f1e1692]:
                  - link "[221]" [ref=f1e1693] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b560-224"
              - paragraph [ref=f1e1695]:
                - text: Post-1081 reforms re-established an effective army; the institution of
                - link "feudal" [ref=f1e1696] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feudal
                - text: "-like"
                - link "pronoia" [ref=f1e1698] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pronoia
                - text: grants provided revenue to individuals in exchange for soldiers.
                - superscript [ref=f1e1699]:
                  - link "[222]" [ref=f1e1700] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b557Kaldellis2021a464Bartusis19975–6-225"
                - text: The new army heavily relied on foreign mercenaries alongside indigenous Byzantine troops, but the financial demands of a standing army proved too much for the Byzantine state, which succumbed to the
                - link "Fourth Crusade" [ref=f1e1702] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fourth_Crusade
                - text: in 1204.
                - superscript [ref=f1e1703]:
                  - link "[223]" [ref=f1e1704] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b557Bartusis19975–7Decker201382-226"
                - text: The
                - link "army of the Palaiologan dynasty" [ref=f1e1706] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_army_(Palaiologan_era)
                - text: ", which retook Constantinople in 1261, was generally composed of a similar mix of mercenaries and indigenous troops, but it had lost all offensive capability by the late 1200s."
                - superscript [ref=f1e1707]:
                  - link "[224]" [ref=f1e1708] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b557–558Decker201382–83-227"
                - text: The empire's continued survival depended on foreign armies; attempts in the 1340s to rebuild the fleet, unwisely disbanded in 1284, were forcibly halted by
                - link "Genoa" [ref=f1e1710] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Republic_of_Genoa
                - text: .
                - superscript [ref=f1e1711]:
                  - link "[225]" [ref=f1e1712] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon2008b558–560Kaldellis2023812,_860–861-228"
                - text: No post-1204 Byzantine field army fielded more than 5,000 troops, and less than 8,000 defended
                - link "the final siege of Constantinople" [ref=f1e1714] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fall_of_Constantinople
                - text: in 1453.
                - superscript [ref=f1e1715]:
                  - link "[226]" [ref=f1e1716] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEDecker201340Haldon2008b559-229"
            - region [ref=f1e1718]:
              - heading "Diplomacy" [level=3] [ref=f1e1720]
              - note [ref=f1e1721]:
                - text: "Further information:"
                - link "Byzantine diplomacy" [ref=f1e1722] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_diplomacy
                - text: and
                - link "Foreign relations of the Byzantine Empire" [ref=f1e1723] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Foreign_relations_of_the_Byzantine_Empire
              - figure [ref=f1e1724]:
                - link [ref=f1e1725] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:John_the_Grammarian_as_ambassador_before_Theophilos_and_Mamun.jpg
                  - img "Manuscript illustration of an embassy travelling between two rulers" [ref=f1e1726]
                - generic [ref=f1e1727]:
                  - text: The embassy of
                  - link "John the Grammarian" [ref=f1e1728] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Patriarch_John_VII_of_Constantinople
                  - text: in 829, sent by emperor
                  - link "Theophilos" [ref=f1e1729] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Theophilos_(emperor)
                  - text: to the Abbasid caliph
                  - link "Al-Ma'mun" [ref=f1e1730] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Al-Ma'mun
              - paragraph [ref=f1e1731]:
                - text: Byzantine strategy was primarily defensive, aside from the brief period of aggression between the ninth and eleventh centuries, because of the empire's habitual lack of resources.
                - superscript [ref=f1e1732]:
                  - link "[227]" [ref=f1e1733] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHoward-Johnston2008940Kaldellis2021a463-230"
                - text: To avoid risky and expensive military campaigns, the Byzantines
                - link "engaged in extensive diplomatic efforts" [ref=f1e1735] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_diplomacy
                - text: .
                - superscript [ref=f1e1736]:
                  - link "[228]" [ref=f1e1737] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHaldon1999278Decker2013130Kaldellis2021a465-231"
                - text: "These took various forms, including: formal embassies, client management, alliance or peace negotiations, political marriages,"
                - link "propaganda" [ref=f1e1739] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Propaganda
                - text: and bribery, or even
                - link "espionage" [ref=f1e1740] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Espionage
                - text: and assassination.
                - superscript [ref=f1e1741]:
                  - link "[229]" [ref=f1e1742] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEDecker2013130,_135–137Kazhdan199015–17-232"
              - paragraph [ref=f1e1744]:
                - text: Defensively oriented Byzantine diplomacy was intended to protect the
                - link "oikoumenē" [ref=f1e1746] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ecumene
                - text: ", the civilised Christian world which the empire rightfully ruled."
                - superscript [ref=f1e1747]:
                  - link "[230]" [ref=f1e1748] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan199010–11Decker2013129-233"
                - text: The decline of the key
                - link "limitrophe system" [ref=f1e1750] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Limitrophe_states
                - text: ", wherein client states along the borders served as intermediaries between the empire and other large enemies, exposed the empire to attack. By the eleventh century, Byzantine diplomacy was more bilateral and balanced."
                - superscript [ref=f1e1751]:
                  - link "[231]" [ref=f1e1752] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan199011–15,_18–21-234"
                - text: Although it lost some important advantages post-1204, diplomacy, including the still-influential Orthodox church, was nevertheless a central element in the empire's lengthy survival until 1453.
                - superscript [ref=f1e1754]:
                  - link "[232]" [ref=f1e1755] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHoward-Johnston2008945Kazhdan199020–21Bartusis1997348Kaldellis2021a466-235"
          - region [ref=f1e1757]:
            - heading "Society" [level=2] [ref=f1e1759]
            - region [ref=f1e1760]:
              - heading "Demography" [level=3] [ref=f1e1762]
              - figure [ref=f1e1763]:
                - link [ref=f1e1764] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Hippodrome_Constantinople_2007_007.jpg
                - generic [ref=f1e1766]:
                  - text: The
                  - link "Obelisk of Theodosius" [ref=f1e1767] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Obelisk_of_Theodosius
                  - text: ", an ancient Egyptian obelisk dedicated to the Egyptian King"
                  - link "Thutmose III" [ref=f1e1768] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Thutmose_III
                  - text: ", was re-erected in the"
                  - link "Hippodrome of Constantinople" [ref=f1e1769] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Hippodrome_of_Constantinople
                  - text: by the Roman emperor
                  - link "Theodosius I" [ref=f1e1770] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Theodosius_I
                  - text: in the 4th century AD.
              - note [ref=f1e1771]:
                - text: "Main article:"
                - link "Demography of the Byzantine Empire" [ref=f1e1772] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Demography_of_the_Byzantine_Empire
              - paragraph [ref=f1e1773]:
                - text: Scholars associate the Roman, Hellenic, and Christian imperial identities with the general population, but there is ongoing debate about how these and other regional identities blended together.
                - superscript [ref=f1e1774]:
                  - link "[233]" [ref=f1e1775] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStewart20222–7,_10Muthesius202281,_96Kaldellis2022b248,_258Pohl201820Stouraitis2018125–127-236"
              - paragraph [ref=f1e1777]:
                - text: As many as 27 million people lived in the empire at its peak in 540, but this fell to 12 million by 800.
                - superscript [ref=f1e1778]:
                  - link "[234]" [ref=f1e1779] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold1997b197,_384–385Kaldellis202321–22Stathakopoulos2008310-237"
                - text: Although plague and territorial losses to Arab Muslim invaders weakened the empire, it eventually recovered and by the near end of the
                - link "Macedonian dynasty" [ref=f1e1781] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Macedonian_dynasty
                - text: in 1025, the population is estimated to have been as high as 18 million.
                - superscript [ref=f1e1782]:
                  - link "[235]" [ref=f1e1783] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStathakopoulos2008312Treadgold1997b931–932-238"
                - text: A few decades after the recapture of Constantinople in 1282, the empire's population was in the range of 3–5 million; by 1312, the number had dropped to 2 million.
                - superscript [ref=f1e1785]:
                  - link "[236]" [ref=f1e1786] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStathakopoulos2008313Treadgold1997b1112-239"
                - text: By the time the Ottoman Turks captured Constantinople, there were only 50,000 people in the city, one-tenth of its population in its prime.
                - superscript [ref=f1e1788]:
                  - link "[237]" [ref=f1e1789] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEStathakopoulos2008310,_314Stathakopoulos202331Kaldellis202321-240"
              - paragraph [ref=f1e1791]:
                - text: Slavery remained legal but declined in economic importance as many former slave roles became free professions and the state increasingly promoted intermediate forms of dependency such as the coloni.
                - superscript [ref=f1e1792]:
                  - link "[238]" [ref=f1e1793] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKaldellis202339Lenski2021473–474-241"
                - text: From the 4th century, imperial legislation progressively limited owners' powers and restricted the enslavement of children, prisoners of war, and eventually Christians.
                - superscript [ref=f1e1795]:
                  - link "[239]" [ref=f1e1796] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERotman200930–31Kaldellis2023140,_425Rotman202237–38,_42Lenski2021461–462,_470-242"
            - region [ref=f1e1798]:
              - heading "Cuisine and dining" [level=3] [ref=f1e1800]
              - note [ref=f1e1801]:
                - text: "Main article:"
                - link "Byzantine cuisine" [ref=f1e1802] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_cuisine
              - paragraph [ref=f1e1803]:
                - text: Feasting was central to the culture.
                - superscript [ref=f1e1804]:
                  - link "[240]" [ref=f1e1805] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBryer2008673-243"
                - text: By the 10th century, dining shifted from
                - link "reclining" [ref=f1e1807] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Triclinium
                - text: to tables with clean linen.
                - superscript [ref=f1e1808]:
                  - link "[241]" [ref=f1e1809] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAsh1995244–245-244"
                - text: The introduction of the
                - link "fork" [ref=f1e1811] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fork
                - text: and
                - link "salad dressing" [ref=f1e1812] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Salad_dressing
                - text: (with
                - link "oil" [ref=f1e1813] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Food_oil
                - text: and
                - link "vinegar" [ref=f1e1814] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vinegar
                - text: ) further shaped Italian and Western traditions.
                - superscript [ref=f1e1815]:
                  - link "[242]" [ref=f1e1816] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAsh1995244Decker2008496-245"
                - text: Classical Greco-Roman era foods were common such as the condiment
                - generic "Ancient Greek (to 1453)-language text" [ref=f1e1818]:
                  - link "garos" [ref=f1e1820] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Garum
                - text: (similar to fermented
                - link "fish sauces" [ref=f1e1821] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fish_sauce
                - text: today) as well as the still popular
                - link "baklava" [ref=f1e1822] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Baklava
                - text: .
                - superscript [ref=f1e1823]:
                  - link "[243]" [ref=f1e1824] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEFaas2005184–185Bryer2008671Ash1995233Vryonis1971482-246"
                - text: Fruits like
                - link "aubergine" [ref=f1e1826] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aubergine
                - text: and
                - link "orange" [ref=f1e1827] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Orange_(fruit)
                - text: ", unknown during classical times, were added to diets."
                - superscript [ref=f1e1828]:
                  - link "[244]" [ref=f1e1829] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEDavidson2014123-247"
                - text: Foods that have continued into the modern era include the cured meat
                - link "paston" [ref=f1e1831] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pastirma
                - text: ","
                - link "Feta" [ref=f1e1832] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feta
                - text: cheese, salt roe similar to the modern
                - link "boutargue" [ref=f1e1833] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Boutargue
                - text: ", Black sea"
                - link "caviar" [ref=f1e1834] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caviar
                - text: ","
                - link "tiropita" [ref=f1e1835] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tiropita
                - text: ","
                - link "dolmades" [ref=f1e1836] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dolma
                - text: ", and the soup"
                - generic "Ancient Greek (to 1453)-language text" [ref=f1e1837]:
                  - link "trachanas" [ref=f1e1839] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Tarhana
                - text: .
                - superscript [ref=f1e1840]:
                  - link "[245]" [ref=f1e1841] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAsh1995244Davidson2014123Bryer2008671Salaman1986184-248"
                - text: There were famed medieval sweet wines such as the
                - link "Malvasia" [ref=f1e1843] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Malvasia
                - text: from
                - link "Monemvasia" [ref=f1e1844] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Monemvasia
                - text: ", the"
                - link "Commandaria" [ref=f1e1845] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Commandaria
                - text: ", and the eponymous"
                - link "Rumney wine" [ref=f1e1846] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rumney_wine
                - text: which were drunk, as were
                - link "millet beer" [ref=f1e1847] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Millet_beer
                - text: (known as
                - generic "Ancient Greek (to 1453)-language text" [ref=f1e1848]: boza
                - text: ) and
                - link "retsina" [ref=f1e1849] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Retsina
                - text: .
                - superscript [ref=f1e1850]:
                  - link "[246]" [ref=f1e1851] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBryer2008672–673Unwin2010185-249"
            - region [ref=f1e1853]:
              - heading "Recreation" [level=3] [ref=f1e1855]
              - figure "A game of τάβλι (tabula) played by the Byzantine emperor Zeno in 480 and recorded by Agathias in c. 530 because of a very unlucky dice throw for Zeno (red)[247]" [ref=f1e1856]:
                - link [ref=f1e1857] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Tabula_-_boardgame_-_Zeno_game.svg
                  - img "A depiction of a board game" [ref=f1e1858]
                - generic [ref=f1e1859]:
                  - text: A game of
                  - link "τάβλι (tabula)" [ref=f1e1860] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Tabula_(game)
                  - text: played by the
                  - link "Byzantine" [ref=f1e1861] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Byzantine
                  - text: emperor
                  - link "Zeno" [ref=f1e1862] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Zeno_(emperor)
                  - text: in 480 and recorded by
                  - link "Agathias" [ref=f1e1863] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Agathias
                  - text: in c.
                  - generic [ref=f1e1864]: "530"
                  - text: because of a very unlucky dice throw for Zeno (red)
                  - superscript [ref=f1e1865]:
                    - link "[247]" [ref=f1e1866] [cursor=pointer]:
                      - /url: "#cite_note-FOOTNOTEHornSchädler2019-250"
              - paragraph [ref=f1e1868]:
                - link "Chariot races" [ref=f1e1869] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chariot_racing
                - text: were held from the early era until 1204, becoming one of the world's longest continuous sporting events.
                - superscript [ref=f1e1870]:
                  - link "[248]" [ref=f1e1871] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJeffreys2008a681–682Kaldellis202313,_138-251"
                - link "Mimes" [ref=f1e1873] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mime_artist
                - text: ", the"
                - link "pantomime" [ref=f1e1874] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pantomime
                - text: and some wild animal shows were prominent until the 6th century.
                - superscript [ref=f1e1875]:
                  - link "[249]" [ref=f1e1876] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJeffreys2008a680-252"
                - text: Because Christian bishops and pagan philosophers did not like these activities, the state's funding for them ceased, leading to their decline and a move to private entertainment and sporting.
                - superscript [ref=f1e1878]:
                  - link "[250]" [ref=f1e1879] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJeffreys2008a678–683Kaldellis2023187,_233-253"
                - text: A Persian version of polo introduced by the Crusaders called
                - link "Tzykanion" [ref=f1e1881] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tzykanisterion
                - text: was played by the nobility and urban aristocracy in major cities during the middle and late eras, as was the sport of jousting introduced from the West.
                - superscript [ref=f1e1882]:
                  - link "[251]" [ref=f1e1883] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991a2137,_\"Tzykanisterion\"Kazanaki-Lappa2002643Jeffreys2008a683Kaldellis2023672,_844-254"
                - text: Over time,
                - link "game boards" [ref=f1e1885] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Board_game
                - text: like
                - link "tavli" [ref=f1e1886] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tabula_(game)
                - text: became increasingly popular.
                - superscript [ref=f1e1887]:
                  - link "[252]" [ref=f1e1888] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJeffreys2008a683-255"
            - region [ref=f1e1890]:
              - heading "Language" [level=3] [ref=f1e1892]
              - note [ref=f1e1893]:
                - text: "Further information:"
                - link "Languages of the Roman Empire" [ref=f1e1894] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Languages_of_the_Roman_Empire
                - text: and
                - link "Medieval Greek" [ref=f1e1895] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Medieval_Greek
              - generic [ref=f1e1897]:
                - generic [ref=f1e1898]:
                  - link [ref=f1e1902] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Mudil_Psalter.jpg
                    - img "A photograph of two pages of a book written in a Greek script. The lower portions of both pages are damaged." [ref=f1e1903]
                  - link [ref=f1e1907] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Joshua_Roll.jpg
                    - img "A photograph of an illustrated manuscript written in Greek. At the left are two people who are standing talking to a person who is seated, while 5 soldiers listen. At the right are a group of soldiers going somewhere." [ref=f1e1908]
                - generic [ref=f1e1910]:
                  - text: "Left: The Mudil Psalter, the oldest complete"
                  - link "psalter" [ref=f1e1911] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Psalter
                  - text: in the Coptic language (
                  - link "Coptic Museum" [ref=f1e1912] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coptic_Museum
                  - text: ", Egypt,"
                  - link "Coptic Cairo" [ref=f1e1913] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coptic_Cairo
                  - text: "). Right: The"
                  - link "Joshua Roll" [ref=f1e1914] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Joshua_Roll
                  - text: ", a 10th-century illuminated Greek manuscript possibly made in Constantinople ("
                  - link "Vatican Library" [ref=f1e1915] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Vatican_Library
                  - text: ", Rome)."
              - paragraph [ref=f1e1916]:
                - link "Latin" [ref=f1e1917] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Latin_language
                - text: and
                - link "Greek" [ref=f1e1918] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_language
                - text: were the primary languages of the late Roman Empire, with the former prevalent in the west and the latter in the east.
                - superscript [ref=f1e1919]:
                  - link "[253]" [ref=f1e1920] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHorrocks2008778-256"
                - text: Although Latin was historically important in the military, legal system, and government, its use declined in Byzantine territories from 400 AD.
                - superscript [ref=f1e1922]:
                  - link "[254]" [ref=f1e1923] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHorrocks2010208Rochette2023282–283-257"
                - text: Greek had begun to replace it even in those functions by the time of
                - link "Justinian I" [ref=f1e1925] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Justinian_I
                - text: (
                - generic [ref=f1e1926]: r. 527–565
                - text: ), who may have tried to arrest Latin's decline. Its extinction in the east was thereafter inevitable.
                - superscript [ref=f1e1927]:
                  - link "[255]" [ref=f1e1928] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHorrocks2008778Rochette2023283–284-258"
                - text: A similar process of linguistic
                - link "Hellenization" [ref=f1e1930] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hellenization
                - text: occurred in Asia Minor, whose inhabitants had mostly abandoned their indigenous languages for Greek by early Byzantine times.
                - superscript [ref=f1e1931]:
                  - link "[256]" [ref=f1e1932] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHorrocks2010208–209-259"
                - text: Still, much of the population of the early empire would have known neither Latin nor Greek, especially in rural areas—their languages included
                - link "Armenian" [ref=f1e1934] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Armenian_language
                - text: in
                - link "Byzantine Armenia" [ref=f1e1935] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Armenia
                - text: ","
                - link "Aramaic" [ref=f1e1936] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aramaic
                - text: dialects such as
                - link "Syriac" [ref=f1e1937] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Syriac_language
                - text: in Mesopotamia and the Levant,
                - link "Coptic" [ref=f1e1938] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coptic_language
                - text: in Egypt,
                - link "Phoenician" [ref=f1e1939] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Phoenician_language
                - text: on the Levant coast and in
                - link "Carthage" [ref=f1e1940] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Carthage
                - text: ", and"
                - link "Berber" [ref=f1e1941] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Berber_languages
                - text: in rural North Africa.
                - superscript [ref=f1e1942]:
                  - link "[257]" [ref=f1e1943] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHorrocks2008778–779Horrocks2010207–210-260"
              - paragraph [ref=f1e1945]:
                - text: By the mid-6th century,
                - link "Geoffrey Horrocks" [ref=f1e1946] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Geoffrey_Horrocks_(philologist)
                - text: estimates that Greek was the native language of about one-third of the population, while it was spoken by 80% of the aristocracy.
                - superscript [ref=f1e1947]:
                  - link "[258]" [ref=f1e1948] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHorrocks2010210–211-261"
                - text: The empire lost its linguistic diversity in the wars of the 7th and 8th centuries, becoming overwhelmingly Greek-speaking.
                - superscript [ref=f1e1950]:
                  - link "[259]" [ref=f1e1951] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETreadgold2002142-262"
                - text: During this troubled period, classical
                - link "Attic Greek" [ref=f1e1953] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Attic_Greek
                - text: —one of the
                - link "linguistic registers" [ref=f1e1954] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Register_(sociolinguistics)
                - text: the Byzantine Greeks inherited—fell out of use, while the
                - link "everyday vernacular" [ref=f1e1955] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vernacular
                - text: registers were still used.
                - superscript [ref=f1e1956]:
                  - link "[260]" [ref=f1e1957] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning198251-263"
                - text: As the empire gained some stability from the 9th century onwards, and especially after the
                - link "Komnenian restoration" [ref=f1e1959] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Komnenian_restoration
                - text: ", Attic Greek came back into fashion for written works. In a phenomenon called"
                - link "diglossia" [ref=f1e1960] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Diglossia
                - text: ", the gap between vernacular spoken Greek, which was rarely written in published works, and literary registers only spoken in formal contexts, became very wide."
                - superscript [ref=f1e1961]:
                  - link "[261]" [ref=f1e1962] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning198251Horrocks2008781–782-264"
              - paragraph [ref=f1e1964]:
                - text: During the
                - link "Palaiologan period" [ref=f1e1965] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Palaiologos_dynasty
                - text: ", although classically written works remained the normal style, Western-inspired writers began to use more vernacular elements, especially for"
                - link "romances" [ref=f1e1966] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romance_(prose_fiction)
                - text: or near-contemporary histories. One example is the
                - link "Chronicle of the Morea" [ref=f1e1968] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chronicle_of_the_Morea
                - text: ", probably written by a French immigrant who was ignorant of formal Greek literature and who incorporated spoken Greek into his work."
                - superscript [ref=f1e1969]:
                  - link "[262]" [ref=f1e1970] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEHorrocks2008783Horrocks2010216–218JeffreysMango2002298–300-265"
                - text: All such written vernacular was in verse form, becoming the ancestor of
                - link "modern Greek" [ref=f1e1972] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Modern_Greek
                - text: poetry, while prose remained classically written.
                - superscript [ref=f1e1973]:
                  - link "[263]" [ref=f1e1974] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning198251–52JeffreysMango2002299-266"
          - region [ref=f1e1976]:
            - heading "Economy" [level=2] [ref=f1e1978]
            - note [ref=f1e1979]:
              - text: "Main article:"
              - link "Byzantine economy" [ref=f1e1980] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantine_economy
            - note [ref=f1e1981]:
              - text: "Further information:"
              - link "Byzantine silk" [ref=f1e1982] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Byzantine_silk
              - text: and
              - link "Sino-Roman relations" [ref=f1e1983] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sino-Roman_relations
            - figure [ref=f1e1984]:
              - link [ref=f1e1985] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Horses_of_Basilica_San_Marco.jpg
              - generic [ref=f1e1987]:
                - text: The four bronze horses that were once in the
                - link "Hippodrome of Constantinople" [ref=f1e1988] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hippodrome_of_Constantinople
                - text: are today put on display in
                - link "Venice" [ref=f1e1989] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Venice
                - text: .
            - paragraph [ref=f1e1990]:
              - text: The empire's geographic and maritime advantages reduced the costs of transporting goods and facilitated trade, making it a key driver of economic growth from antiquity and through the post-classical period.
              - superscript [ref=f1e1991]:
                - link "[264]" [ref=f1e1992] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009473LaiouMorrisson200713-267"
              - text: Infrastructure, including roads, public buildings, and the legal system, supported trade and other economic activities.
              - superscript [ref=f1e1994]:
                - link "[265]" [ref=f1e1995] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTELaiouMorrisson200724-268"
              - text: Regions like Asia Minor, the Aegean islands, Egypt, the Levant, and Africa thrived as mature economic centres despite political challenges and military insecurities.
              - superscript [ref=f1e1997]:
                - link "[266]" [ref=f1e1998] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009467LaiouMorrisson2007246-269"
              - text: From the mid-6th century onward, plagues, invasions, and wars caused populations and economies to decline, leading to the collapse of the ancient economy.
              - superscript [ref=f1e2000]:
                - link "[267]" [ref=f1e2001] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009472,_474,_479Laiou2002c698LaiouMorrisson200724-270"
              - text: Major cities like Constantinople, Antioch,
              - link "Alexandria" [ref=f1e2003] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Alexandria
              - text: ", and"
              - link "Thessaloniki" [ref=f1e2004] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Thessaloniki
              - text: continued to support substantial populations exceeding 100,000, while the countryside transitioned into fortified settlements.
              - superscript [ref=f1e2005]:
                - link "[268]" [ref=f1e2006] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTELaiou2002a177LaiouMorrisson200725–26-271"
              - text: These rural areas developed into hamlets and villages, reflecting an economic shift between historical periods towards more efficient land use.
              - superscript [ref=f1e2008]:
                - link "[269]" [ref=f1e2009] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009465,_471LaiouMorrisson200725–26,_232-272"
            - paragraph [ref=f1e2011]:
              - text: Low population density prompted emperors to encourage migration and resettlement, stimulating agriculture and demographic growth.
              - superscript [ref=f1e2012]:
                - link "[270]" [ref=f1e2013] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTELaiouMorrisson200744–46-273"
              - text: By the 9th century, the economy began to revive, marked by increased agricultural production and urban expansion.
              - superscript [ref=f1e2015]:
                - link "[271]" [ref=f1e2016] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009473–474Laiou2002a269–270-274"
              - text: Advances in science, technical knowledge, and literacy gave the empire a competitive edge over its neighbours.
              - superscript [ref=f1e2018]:
                - link "[272]" [ref=f1e2019] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTELaiouMorrisson200719–22,_24-275"
              - text: The 11th and 12th centuries witnessed consistent and rapid population growth, marking the peak of this revival.
              - superscript [ref=f1e2021]:
                - link "[273]" [ref=f1e2022] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009476LaiouMorrisson200790–92-276"
              - text: Italian merchants, particularly the Venetians, Genoese, and Pisans, took control of international trade, thus reducing the influence of native merchants.
              - superscript [ref=f1e2024]:
                - link "[274]" [ref=f1e2025] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009473–476Laiou2002a25,_402-277"
              - text: The political system grew increasingly extractive and authoritarian, contributing to the empire's collapse in 1204.
              - superscript [ref=f1e2027]:
                - link "[275]" [ref=f1e2028] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTELaiou2002a23Laiou2002b1164LaiouMorrisson2007233-278"
            - paragraph [ref=f1e2030]:
              - text: The fall of Constantinople during the Fourth Crusade in 1204 destroyed centuries of its wealth.
              - superscript [ref=f1e2031]:
                - link "[276]" [ref=f1e2032] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEMagdalino2002b535-279"
              - text: Large landholdings were confiscated, and the empire fragmented into smaller rump states ruled by competing factions, making governance inefficient and increasing the costs of doing business.
              - superscript [ref=f1e2034]:
                - link "[277]" [ref=f1e2035] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEKaldellis2023739LaiouMorrisson2007167–168-280"
              - text: The state gradually lost control over trade practices, price regulations, the outflow of precious metals, and possibly even the minting of coins.
              - superscript [ref=f1e2037]:
                - link "[278]" [ref=f1e2038] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEMatschke2002805–806-281"
              - text: Italian merchants further dominated trade as the events of 1204 opened the Black Sea to Western merchants, permanently altering the empire's fortunes.
              - superscript [ref=f1e2040]:
                - link "[279]" [ref=f1e2041] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009477Matschke2002771–772LaiouMorrisson2007203-282"
              - text: Farmers and manufacturers increasingly produced goods for local use and were affected by the insecurity of constant warfare.
              - superscript [ref=f1e2043]:
                - link "[280]" [ref=f1e2044] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEMatschke2002779LaiouMorrisson2007168-283"
              - text: Despite these challenges, the empire's mixed economy (characterised by state interventions, public works, and market liberalisation)
              - superscript [ref=f1e2046]:
                - link "[281]" [ref=f1e2047] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTELaiou2002c754-284"
              - text: remained a model of medieval economic adaptability, even as it deteriorated under external pressures.
              - superscript [ref=f1e2049]:
                - link "[282]" [ref=f1e2050] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWhittow2009471LaiouMorrisson2007232–235-285"
          - region [ref=f1e2052]:
            - heading "Arts and sciences" [level=2] [ref=f1e2054]
            - region [ref=f1e2055]:
              - heading "Art and architecture" [level=3] [ref=f1e2057]
              - note [ref=f1e2058]:
                - text: "Main articles:"
                - link "Byzantine art" [ref=f1e2059] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_art
                - text: and
                - link "Byzantine architecture" [ref=f1e2060] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_architecture
              - generic [ref=f1e2062]:
                - generic [ref=f1e2063]:
                  - link [ref=f1e2067] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Spas_vsederzhitel_sinay.jpg
                  - link [ref=f1e2072] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Hosios_Loukas_Katholikon_(nave,_South-West_squinch)_-_Baptism_-_detail_02.jpg
                - generic [ref=f1e2074]:
                  - link [ref=f1e2078] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Meister_von_Nerezi_001.jpg
                  - link [ref=f1e2083] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Ivoire_Barberini_-_Musée_du_Louvre_Objets_d'art_OA_9063_;_MND_211.jpg
                - link [ref=f1e2089] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Hagia_Sophia_in_Istanbul_(focused_on_the_original_Roman_building).jpg
                - generic [ref=f1e2092]:
                  - text: "Clockwise, from top left:"
                  - list [ref=f1e2093]:
                    - listitem [ref=f1e2094]:
                      - link "Christ Pantocrator" [ref=f1e2095] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Christ_Pantocrator_(Sinai)
                      - text: icon, 6th century,
                      - link "Sinai Monastery" [ref=f1e2096] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Sinai_Monastery
                    - listitem [ref=f1e2097]:
                      - link "Hosios Loukas" [ref=f1e2098] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Hosios_Loukas
                      - text: mosaics, detail, early 11th century
                    - listitem [ref=f1e2099]:
                      - link "Barberini ivory" [ref=f1e2100] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Barberini_ivory
                      - text: ", an early 6th-century ivory diptych"
                      - superscript [ref=f1e2101]:
                        - link "[283]" [ref=f1e2102] [cursor=pointer]:
                          - /url: "#cite_note-FOOTNOTECormack201839-286"
                    - listitem [ref=f1e2104]:
                      - text: The
                      - link "Hagia Sophia" [ref=f1e2105] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Hagia_Sophia
                      - text: exterior
                    - listitem [ref=f1e2106]:
                      - text: Dead Christ and Mourners, c.
                      - generic [ref=f1e2107]: "1164"
                      - text: ","
                      - link "Gorno Nerezi" [ref=f1e2108] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Church_of_Saint_Panteleimon,_Gorno_Nerezi
                      - superscript [ref=f1e2109]:
                        - link "[284]" [ref=f1e2110] [cursor=pointer]:
                          - /url: "#cite_note-FOOTNOTEJames2003§_para._3-287"
              - paragraph [ref=f1e2112]:
                - text: Subjects in
                - link "Byzantine art" [ref=f1e2113] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_art
                - text: were primarily
                - link "Christian" [ref=f1e2114] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christian_art
                - text: and typically non-naturalistic in their representation.
                - superscript [ref=f1e2115]:
                  - link "[285]" [ref=f1e2116] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_paras._2_and_13-288"
                - text: Emerging from both the
                - link "earliest Christian" [ref=f1e2118] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Early_Christian_art_and_architecture
                - text: and
                - link "Late Antique art" [ref=f1e2119] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Late_Antique_art
                - text: ","
                - superscript [ref=f1e2120]:
                  - link "[286]" [ref=f1e2121] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley19942Cormack201811–12-289"
                - text: many early examples were lost amid the
                - link "Roman Persecutions" [ref=f1e2123] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Persecution_of_Christians_in_the_Roman_Empire
                - text: ; the fragmented mosaics of the 3rd-century
                - link "Dura-Europos church" [ref=f1e2124] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dura-Europos_church
                - text: are a unique exception.
                - superscript [ref=f1e2125]:
                  - link "[287]" [ref=f1e2126] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley199412–14-290"
                - text: Such
                - link "Byzantine mosaics" [ref=f1e2128] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_mosaics
                - text: ", known for their"
                - link "gold ground" [ref=f1e2129] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gold_ground
                - text: style, became a hallmark of the empire, displaying both secular and sacred themes in diverse places, including churches (
                - link "Basilica of San Vitale" [ref=f1e2130] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basilica_of_San_Vitale
                - text: ), the circus (
                - link "Hippodrome of Constantinople" [ref=f1e2131] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hippodrome_of_Constantinople
                - text: ), and the
                - link "Great Palace of Constantinople" [ref=f1e2132] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Great_Palace_of_Constantinople
                - text: .
                - superscript [ref=f1e2133]:
                  - link "[288]" [ref=f1e2134] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley199434James2003§_paras._3–4-291"
                - text: "The early 6th-century reign of Justinian I saw systemic developments:"
                - link "religious art" [ref=f1e2136] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Religious_art
                - text: came to dominate, and once-popular public marble and bronze
                - link "monumental sculpture" [ref=f1e2137] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Monumental_sculpture
                - text: fell out of favor due to
                - link "pagan" [ref=f1e2138] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pagan
                - text: associations.
                - superscript [ref=f1e2139]:
                  - link "[289]" [ref=f1e2140] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley199432–33,_56–57Cormack201814-292"
                - text: Justinian commissioned the monumental
                - link "Hagia Sophia" [ref=f1e2142] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hagia_Sophia
                - text: "church, and its influential elements became architectural hallmarks for the empire: the immense size, large"
                - link "dome" [ref=f1e2143] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dome
                - text: ", innovative use of"
                - link "pendentives" [ref=f1e2144] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pendentive
                - text: and highly decorative interior were imitated as far north as the
                - link "Cathedral of Saint Sophia" [ref=f1e2145] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cathedral_of_Saint_Sophia,_Novgorod
                - text: in
                - link "Novgorod" [ref=f1e2146] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Novgorod
                - text: and the
                - link "Saint Sophia Cathedral" [ref=f1e2147] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Saint_Sophia_Cathedral,_Kyiv
                - text: in
                - link "Kiev" [ref=f1e2148] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kiev
                - text: .
                - superscript [ref=f1e2149]:
                  - link "[290]" [ref=f1e2150] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_para._10Cormack201833–40CurlWilson2021§_paras._3_and_5-293"
                - text: The Hagia Sophia's creators, the engineer-architects
                - link "Isidore of Miletus" [ref=f1e2152] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Isidore_of_Miletus
                - text: and
                - link "Anthemius of Tralles" [ref=f1e2153] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthemius_of_Tralles
                - text: ", are uniquely esteemed;"
                - superscript [ref=f1e2154]:
                  - link "[291]" [ref=f1e2155] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley199467-294"
                - text: most Byzantine artists were unrecorded and typically deemed to have little importance.
                - superscript [ref=f1e2157]:
                  - link "[292]" [ref=f1e2158] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_para._7-295"
              - paragraph [ref=f1e2160]:
                - text: "Smaller-scale art flourished throughout the entire Byzantine period: costly"
                - link "ivory carvings" [ref=f1e2161] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ivory_carving
                - text: —often as diptychs (
                - link "Barberini ivory" [ref=f1e2162] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Barberini_ivory
                - text: ) or triptychs (
                - link "Harbaville Triptych" [ref=f1e2163] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Harbaville_Triptych
                - text: )—featured imperial commemorations or religious scenes and were particularly valued, as were
                - link "metalwork" [ref=f1e2164] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Metalwork
                - text: and
                - link "enamels" [ref=f1e2165] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_enamel
                - text: .
                - superscript [ref=f1e2166]:
                  - link "[293]" [ref=f1e2167] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_para._4Cormack201839-296"
                - text: Other costly objects included
                - link "illuminated manuscripts" [ref=f1e2169] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_illuminated_manuscripts
                - text: ", which were lavishly illustrated for a wide range of texts, and"
                - link "silks" [ref=f1e2170] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_silk
                - text: ", often dyed in the prized"
                - link "imperial purple" [ref=f1e2171] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Imperial_purple
                - text: ; both became highly popular in Western Europe.
                - superscript [ref=f1e2172]:
                  - link "[294]" [ref=f1e2173] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_paras._4–5-297"
                - text: The rise of small, portable
                - link "icon" [ref=f1e2175] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Icon
                - text: paintings, used for both public and private religious worship, grew increasingly controversial.
                - superscript [ref=f1e2176]:
                  - link "[295]" [ref=f1e2177] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley1994101–102Cormack20182-298"
                - text: During two periods of
                - link "Byzantine Iconoclasm" [ref=f1e2179] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Iconoclasm
                - text: (726–843), possibly influenced by
                - link "Islamic prohibitions on religious images" [ref=f1e2180] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aniconism_in_Islam
                - text: ","
                - superscript [ref=f1e2181]:
                  - link "[296]" [ref=f1e2182] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELowden1997147–148-299"
                - text: icons were suppressed and enormous amounts of figurative religious art was destroyed.
                - superscript [ref=f1e2184]:
                  - link "[297]" [ref=f1e2185] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMatthewsPlatt1997185-300"
                - link "Iconoclasts" [ref=f1e2187] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iconoclast
                - text: condemned their use, likening them to pagan
                - link "idolatry" [ref=f1e2188] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Idolatry
                - text: and ascribing recent
                - link "Umayyad defeats" [ref=f1e2189] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine–Arab_wars_(780–1180)#Raids_under_the_last_Umayyads_and_the_rise_of_Iconoclasm
                - text: as
                - link "divine retribution" [ref=f1e2190] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Divine_retribution
                - text: for their use.
                - link "Iconophiles" [ref=f1e2191] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iconophile
                - text: eventually prevailed, maintaining their essential use for
                - link "veneration" [ref=f1e2192] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Veneration
                - text: ", considered distinct from"
                - link "worship" [ref=f1e2193] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Worship
                - text: ", and found precedent in"
                - link "gospel" [ref=f1e2194] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gospel
                - text: references.
                - superscript [ref=f1e2195]:
                  - link "[298]" [ref=f1e2196] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley1994115–116Lowden1997147–151-301"
              - paragraph [ref=f1e2198]:
                - link "Post-iconoclast Macedonian art" [ref=f1e2199] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Macedonian_art_(Byzantine)
                - text: (867–1056) saw a
                - link "cultural renaissance" [ref=f1e2200] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Macedonian_Renaissance
                - text: ", and many artworks from this period survive."
                - superscript [ref=f1e2201]:
                  - link "[299]" [ref=f1e2202] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley1994132Lowden1997187–188-302"
                - text: Subjects and styles became standardised, particularly
                - link "cross-in-square" [ref=f1e2204] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cross-in-square
                - text: churches, and already-existing frontality and
                - link "symmetry" [ref=f1e2205] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Symmetry
                - text: evolved into a dominant artistic aesthetic, observable in the small
                - link "Pala d'Oro" [ref=f1e2206] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pala_d'Oro
                - text: enamel and the large mosaics of the
                - link "Hosios Loukas" [ref=f1e2207] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hosios_Loukas
                - text: ","
                - link "Daphni" [ref=f1e2208] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Daphni_Monastery
                - text: ", and"
                - link "Nea Moni" [ref=f1e2209] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nea_Moni_of_Chios
                - text: monasteries.
                - superscript [ref=f1e2210]:
                  - link "[300]" [ref=f1e2211] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_para._3Cormack2018146–147-303"
                - text: The subsequent Komnenos-Angelos periods (1081–1204) saw increased imperial patronage, alongside figurative artwork of increased emotional expression (Dead Christ and Mourners, c.
                - generic [ref=f1e2213]: "1164"
                - text: ).
                - superscript [ref=f1e2214]:
                  - link "[284]" [ref=f1e2215] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_para._3-287"
                - text: Byzantine artistic influence spread widely to
                - link "Norman Sicily" [ref=f1e2217] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Norman–Arab–Byzantine_culture
                - text: (the
                - link "Madrid Skylitzes" [ref=f1e2219] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Madrid_Skylitzes
                - text: ) and Venice (the mosaics of
                - link "St Mark's Basilica" [ref=f1e2220] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/St_Mark's_Basilica
                - text: ).
                - superscript [ref=f1e2221]:
                  - link "[284]" [ref=f1e2222] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJames2003§_para._3-287"
                - text: Serbian churches flourished, as three successive
                - link "schools of architecture" [ref=f1e2224] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Medieval_Serbian_architecture
                - text: —
                - link "Raška" [ref=f1e2225] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Raška_architectural_school
                - text: (1170–1282),
                - link "Byzantine Serbia" [ref=f1e2226] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Serbo-Byzantine_architecture
                - text: (1282–1355), and
                - link "Morava" [ref=f1e2227] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Morava_architectural_school
                - text: (1355–1489)—combined a
                - link "Romanesque" [ref=f1e2228] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Romanesque_architecture
                - text: aesthetic with increasingly voluminous decorations and domes.
                - superscript [ref=f1e2229]:
                  - link "[301]" [ref=f1e2230] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTECurlWilson2021§_para._7-304"
                - text: As smaller
                - link "Palaeologan artworks" [ref=f1e2232] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Palaeologan_Renaissance#Art_and_architecture
                - text: (1261–1453) gained
                - link "relic" [ref=f1e2233] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Relic
                - text: status in Western Europe—many looted in the 1204 Fourth Crusade—they greatly influenced the
                - link "Italo-Byzantine" [ref=f1e2234] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Italo-Byzantine
                - text: style of
                - link "Cimabue" [ref=f1e2235] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cimabue
                - text: ","
                - link "Duccio" [ref=f1e2236] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Duccio
                - text: ", and later"
                - link "Giotto" [ref=f1e2237] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Giotto
                - text: ; the latter is traditionally regarded by art historians as the inaugurator of
                - link "Italian Renaissance painting" [ref=f1e2238] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Italian_Renaissance_painting
                - text: .
                - superscript [ref=f1e2239]:
                  - link "[302]" [ref=f1e2240] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERodley1994166Cormack2018159,_186Andronikou20222–4-305"
            - region [ref=f1e2242]:
              - heading "Literature" [level=3] [ref=f1e2244]
              - note [ref=f1e2245]:
                - text: "Main article:"
                - link "Byzantine literature" [ref=f1e2246] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_literature
              - figure [ref=f1e2247]:
                - link [ref=f1e2248] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Anna_comnena,_alexiade,_forse_da_costantinopoli,_XII_secolo_(pluteo_70.2).jpg
                - generic [ref=f1e2250]:
                  - text: The
                  - link "Alexiad" [ref=f1e2252] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Alexiad
                  - text: ", a history by"
                  - link "Anna Komnene" [ref=f1e2253] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Anna_Komnene
                  - text: ", in a 12th-century manuscript. Kept in the"
                  - link "Biblioteca Medicea Laurenziana" [ref=f1e2254] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Biblioteca_Medicea_Laurenziana
                  - text: ", Florence"
              - paragraph [ref=f1e2255]:
                - link "Byzantine literature" [ref=f1e2256] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_literature
                - text: concerns all
                - link "Greek literature" [ref=f1e2257] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_literature
                - text: from the
                - link "Middle Ages" [ref=f1e2258] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Middle_Ages
                - text: .
                - superscript [ref=f1e2259]:
                  - link "[303]" [ref=f1e2260] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning2022§_para._1-306"
                - text: Although the empire was
                - link "linguistically diverse" [ref=f1e2262] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Languages_of_the_Roman_Empire
                - text: ", the vast majority of extant texts are in"
                - link "medieval Greek" [ref=f1e2263] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Medieval_Greek
                - text: ","
                - superscript [ref=f1e2264]:
                  - link "[304]" [ref=f1e2265] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPapaioannou2021a1–2,_5–7-307"
                - text: in two
                - link "diglossic" [ref=f1e2267] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Diglossia
                - text: "variants: a scholarly form based on"
                - link "Attic Greek" [ref=f1e2268] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Attic_Greek
                - text: ", and a"
                - link "vernacular" [ref=f1e2269] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vernacular
                - text: based on
                - link "Koine Greek" [ref=f1e2270] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Koine_Greek
                - text: .
                - superscript [ref=f1e2271]:
                  - link "[305]" [ref=f1e2272] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning1991a-308"
                - text: Most contemporary scholars consider all medieval Greek texts to be literature,
                - superscript [ref=f1e2274]:
                  - link "[306]" [ref=f1e2275] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPapaioannou2021a10-309"
                - text: but some offer varying constraints.
                - superscript [ref=f1e2277]:
                  - link "[307]" [ref=f1e2278] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan19991van_Dieten1980101–105-310"
                - text: The literature's early period (c.
                - generic [ref=f1e2280]: 330–650
                - text: ) was dominated by the competing cultures of
                - link "Hellenism" [ref=f1e2281] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hellenistic_period
                - text: ","
                - link "Christianity" [ref=f1e2282] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eastern_Orthodox_Church
                - text: and
                - link "Paganism" [ref=f1e2283] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Religion_in_ancient_Rome
                - text: .
                - superscript [ref=f1e2284]:
                  - link "[308]" [ref=f1e2285] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning2022§_paras._1–2Kaldellis2021162–163-311"
                - text: The
                - link "Greek Church Fathers" [ref=f1e2287] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Church_Fathers#Greek_Fathers
                - text: —educated in an Ancient Greek
                - link "rhetoric" [ref=f1e2288] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rhetoric
                - text: tradition—sought to synthesise these influences.
                - superscript [ref=f1e2289]:
                  - link "[303]" [ref=f1e2290] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning2022§_para._1-306"
                - text: Important early writers include
                - link "John Chrysostom" [ref=f1e2292] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_Chrysostom
                - text: ","
                - link "Pseudo-Dionysius the Areopagite" [ref=f1e2293] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pseudo-Dionysius_the_Areopagite
                - text: and
                - link "Procopius" [ref=f1e2294] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Procopius
                - text: ", all of whom aimed to reinvent older forms to fit the empire."
                - superscript [ref=f1e2295]:
                  - link "[309]" [ref=f1e2296] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1236-312"
                - text: Theological
                - link "miracle" [ref=f1e2298] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Miracle
                - text: stories were particularly innovative and popular;
                - superscript [ref=f1e2299]:
                  - link "[309]" [ref=f1e2300] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1236-312"
                - text: the
                - link "Sayings of the Desert Fathers" [ref=f1e2303] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sayings_of_the_Desert_Fathers
                - text: (Apophthegmata Patrum) were copied in nearly every Byzantine monastery.
                - superscript [ref=f1e2304]:
                  - link "[310]" [ref=f1e2305] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEMartín2021685-313"
                - text: During the
                - link "Byzantine Dark Ages" [ref=f1e2307] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_Dark_Ages
                - text: (c.
                - generic [ref=f1e2308]: 650–800
                - text: ), production of literature mostly stopped, though some important theologians were active, such as
                - link "Maximus the Confessor" [ref=f1e2309] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maximus_the_Confessor
                - text: ","
                - link "Germanus I of Constantinople" [ref=f1e2310] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Germanus_I_of_Constantinople
                - text: and
                - link "John of Damascus" [ref=f1e2311] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_of_Damascus
                - text: .
                - superscript [ref=f1e2312]:
                  - link "[309]" [ref=f1e2313] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1236-312"
              - paragraph [ref=f1e2315]:
                - text: The subsequent cultural Macedonian Renaissance (c.
                - generic [ref=f1e2316]: 800–1000
                - text: ; the "Encyclopedism period") saw a renewed proliferation of literature and revived the earlier Hellenic-Christian synthesis.
                - superscript [ref=f1e2317]:
                  - link "[303]" [ref=f1e2318] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrowning2022§_para._1-306"
                - text: Works by
                - link "Homer" [ref=f1e2320] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Homer
                - text: ","
                - link "Ancient Greek philosophers" [ref=f1e2321] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_ancient_Greek_philosophers
                - text: and
                - link "tragedians" [ref=f1e2322] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greek_tragedy
                - text: were translated, and
                - link "hagiography" [ref=f1e2323] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hagiography
                - text: was heavily reorganised.
                - superscript [ref=f1e2324]:
                  - link "[309]" [ref=f1e2325] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1236-312"
                - text: After this early flowering of monastic literature, there was a dearth until
                - link "Symeon the New Theologian" [ref=f1e2327] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Symeon_the_New_Theologian
                - text: in the late 10th century.
                - superscript [ref=f1e2328]:
                  - link "[309]" [ref=f1e2329] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1236-312"
                - text: A new generation (c.
                - generic [ref=f1e2331]: 1000–1250
                - text: ), including Symeon,
                - link "Michael Psellos" [ref=f1e2332] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_Psellos
                - text: and
                - link "Theodore Prodromos" [ref=f1e2333] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodore_Prodromos
                - text: ", rejected the Encyclopedist emphasis on order, and were interested in individual-focused ideals variously concerning"
                - link "mysticism" [ref=f1e2334] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christian_mysticism
                - text: ","
                - link "authorial voice" [ref=f1e2335] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Authorial_voice
                - text: ", heroism, humour and love."
                - superscript [ref=f1e2336]:
                  - link "[311]" [ref=f1e2337] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1236–1237-314"
                - text: This included the Hellenistic-inspired
                - link "Byzantine romance" [ref=f1e2339] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_romance
                - text: and
                - link "chivalric" [ref=f1e2340] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chivalry
                - text: approaches in rhetoric, historiography and the influential epic
                - link "Digenes Akritas" [ref=f1e2342] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Digenes_Akritas
                - text: .
                - superscript [ref=f1e2343]:
                  - link "[309]" [ref=f1e2344] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1236-312"
                - text: The empire's final centuries saw a renewal of hagiography and increased Western influence, leading to mass Greek to Latin translations.
                - superscript [ref=f1e2346]:
                  - link "[312]" [ref=f1e2347] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1237-315"
                - text: Authors such as
                - link "Gemistos Plethon" [ref=f1e2349] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gemistos_Plethon
                - text: and
                - link "Bessarion" [ref=f1e2350] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bessarion
                - text: exemplified a new focus on human
                - link "vices" [ref=f1e2351] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vice
                - text: alongside the preservation of classical traditions, the latter greatly influenced the
                - link "Italian Renaissance" [ref=f1e2352] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Italian_Renaissance
                - text: .
                - superscript [ref=f1e2353]:
                  - link "[312]" [ref=f1e2354] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKazhdan1991b1237-315"
            - region [ref=f1e2356]:
              - heading "Music" [level=3] [ref=f1e2358]
              - note [ref=f1e2359]:
                - text: "Main article:"
                - link "Byzantine music" [ref=f1e2360] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Byzantine_music
              - generic [ref=f1e2362]:
                - link [ref=f1e2367] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Mosaic_of_the_Female_Musicians.jpg
                - generic [ref=f1e2369]:
                  - link "File:Mosaic of the Female Musicians.jpg" [ref=f1e2371] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Mosaic_of_the_Female_Musicians.jpg
                  - text: Late 4th-century "Mosaic of the Musicians" playing the
                  - link "organ" [ref=f1e2372] [cursor=pointer]:
