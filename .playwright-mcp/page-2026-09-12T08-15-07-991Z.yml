                - link "United States v. Moore" [ref=e170] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_v._Moore_(1973)
                - text: was a 1973 case heard by the
                - link "U.S. Court of Appeals for the D.C. Circuit" [ref=e171] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_Court_of_Appeals_for_the_District_of_Columbia_Circuit
                - text: . Police officers found the defendant, Raymond Moore, in a hotel room with
                - link "heroin" [ref=e172] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Heroin
                - text: capsules in his pocket and charged him with narcotics possession. Moore claimed at
                - link "trial" [ref=e173] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Trial
                - text: and on
                - link "appeal" [ref=e174] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Appeal
                - text: that his
                - link "addiction" [ref=e175] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Addiction
                - text: to heroin forced him to possess and use drugs. He argued that, because he lacked the
                - link "free will" [ref=e176] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free_will
                - text: to keep himself from possessing drugs, he should not be criminally liable. He was convicted and sentenced to six years in prison. The D.C. Circuit upheld Moore's conviction in a 5–4 vote, refusing to create the addiction defense. The five judges, split across two separate opinions, doubted that addicts physically cannot keep themselves from taking drugs; they also worried that the defense could apply to crimes more serious than possession, or lead people to fake addiction. The dissent supported Moore's legal arguments and argued that the justice system accomplishes nothing by imprisoning an addict for possession.
